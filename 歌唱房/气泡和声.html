<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>气泡和声 · 歌唱房</title>
<style>
:root{
	--paper:#efe6d4; --ink:#2c2318; --gold:#d9a441; --blue:#7ab0d8; --red:#c93b2e;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
	background:radial-gradient(120% 90% at 50% 0%,#1e2c3e 0%,#141d2c 55%,#0b111c 100%);
	color:var(--paper);font-family:"Kaiti SC",KaiTi,STKaiti,"Noto Serif SC",serif;
	overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none;
}
#stage{position:fixed;inset:0;display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding:max(10px,env(safe-area-inset-top)) 14px 12px}
header{display:flex;align-items:baseline;gap:13px;padding:2px 4px 8px;flex:none}
header h1{font-size:17px;letter-spacing:.35em;color:var(--gold);font-weight:600}
#hud{display:flex;gap:12px;margin-left:auto;font-size:13.5px;color:#c8c2ae;white-space:nowrap}
#hud b{color:#fff;font-size:16px;font-weight:600;font-family:Georgia,"Microsoft YaHei",serif}
#hud .cbo{color:#8a94a8}#hud .cbo b{color:var(--gold)}
#say{flex:none;height:30px;display:flex;align-items:center;justify-content:center;font-size:14.5px;letter-spacing:.1em;color:#b8b09a}
#say b{color:var(--gold)}
#field{position:relative;flex:1;margin:4px 0 14px;overflow:hidden;border-radius:12px;
	background:linear-gradient(180deg,rgba(20,32,52,.5),rgba(12,20,36,.65));
	border:2px solid rgba(122,176,216,.18)}
#ring{position:absolute;left:0;right:0;top:28%;height:32%;background:rgba(217,164,65,.035);border-block:1px dashed rgba(217,164,65,.24);pointer-events:none}
#ring::before,#ring::after{content:"";position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);height:34.375%;background:rgba(240,196,106,.08);border-block:1px solid rgba(240,196,106,.25)}
#ring::after{height:2px;border:0;background:rgba(255,235,190,.8)}
#ring.pulse{animation:rpulse .25s}
@keyframes rpulse{50%{transform:scale(1.18)}}
.bub{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;
	background:radial-gradient(circle at 34% 30%,rgba(255,255,255,.5),rgba(150,200,240,.22) 46%,rgba(110,160,210,.12));
	border:2px solid rgba(180,215,245,.65);
	display:flex;align-items:center;justify-content:center;
	font-size:17px;color:#f4f8ff;text-shadow:0 1px 3px rgba(10,20,40,.6);cursor:pointer}
.bub.gone{transition:transform .22s, opacity .22s;transform:scale(1.7);opacity:0}
.bub.missed{transition:opacity .4s;opacity:.25;background:none;border-color:rgba(200,120,110,.5)}
.judge{position:absolute;margin:-22px 0 0 -22px;width:44px;text-align:center;font-size:15px;font-weight:700;letter-spacing:.1em}
.judge.p{color:#ffd68c}.judge.g{color:#9ecbff}.judge.m{color:#e08a7a}
.judge{animation:jrise .5s forwards}
@keyframes jrise{to{transform:translateY(-26px);opacity:0}}
#panel{position:fixed;inset:0;background:rgba(8,13,22,.84);backdrop-filter:blur(3px);
	display:grid;place-items:center;z-index:10;opacity:1;transition:opacity .3s}
#panel.hide{opacity:0;pointer-events:none}
.card{width:min(88vw,420px);background:linear-gradient(170deg,#e8eef4,#d3dce6);border-radius:14px;
	padding:26px 26px 22px;text-align:center;color:#2c3440;box-shadow:0 24px 60px rgba(0,0,0,.6)}
.card h2{font-size:26px;letter-spacing:.3em;margin-bottom:6px}
.card .sub{font-size:13px;letter-spacing:.22em;color:#7e8ba0;margin-bottom:16px}
.card .rows{font-size:14.5px;line-height:2;color:#465264;margin-bottom:6px}
.card .rows b{color:#3a6a9a;font-weight:600}
.go{margin:12px 6px 4px;padding:12px 38px;font-size:16px;letter-spacing:.3em;border:none;border-radius:9px;
	background:linear-gradient(180deg,#e8b455,#c98f2e);color:#fff;cursor:pointer;font-family:inherit;
	box-shadow:0 4px 0 #8a5a1e;transition:transform .08s, box-shadow .08s}
.go:active{transform:translateY(3px);box-shadow:0 1px 0 #8a5a1e}
.go.g2{background:none;box-shadow:none;border:2px solid #8a5a1e;color:#8a5a1e;padding:12px 22px}
.back{display:inline-block;margin-top:12px;color:#6e7c92;font-size:14px;letter-spacing:.15em;text-decoration:none;
	border-bottom:1px dashed #8494aa;padding-bottom:2px}
@media (prefers-reduced-motion: reduce){ .bub,.judge{transition:none;animation:none} }

/* 三间音乐房共用同一套暂停手势，原生对话框负责焦点约束。 */
header{flex-wrap:wrap}#hud{flex-wrap:wrap;justify-content:flex-end}
.session-bar{display:flex;align-items:center;justify-content:flex-end;gap:10px;flex:none;min-height:36px}
.session-bar button,.session-bar a{font:inherit;font-size:13px;color:#f3dfb3;background:#352b25;border:1px solid #a58b54;border-radius:7px;padding:7px 11px;text-decoration:none;cursor:pointer}
.session-bar button:disabled{opacity:.4;cursor:default}
.session-bar span{margin-right:auto;font-size:12px;color:#cdb98e}
button:focus-visible,a:focus-visible{outline:3px solid #ffe2a2;outline-offset:3px}
#pause-dialog{margin:auto;max-width:calc(100vw - 32px);width:360px;border:1px solid #aa884b;border-radius:16px;padding:28px 24px;color:#f5e6ca;background:#29231f;text-align:center;box-shadow:0 20px 80px #0009}
#pause-dialog::backdrop{background:#080b13bc;backdrop-filter:blur(3px)}
#pause-dialog h2{font-size:24px;margin-bottom:12px}#pause-dialog p{line-height:1.8;font-size:14px;margin-bottom:14px}
#pause-dialog button{display:block;margin:10px auto 0;width:100%;padding:12px;border-radius:8px;border:1px solid #b58c45;font:inherit;cursor:pointer;background:#d6a14c;color:#211a10}
#pause-dialog #leave-game{background:transparent;color:#e9d9b9}
body.paused *,body.paused *::before,body.paused *::after{animation-play-state:paused!important}
</style>
</head>
<body>
<div id="stage">
	<header><h1>气泡和声</h1>
		<div id="hud"><span>分数 <b id="t-score">0</b></span><span>唱到 <b id="t-at">0</b>/28</span>
		<span>连击 <b id="t-combo">0</b></span><span class="cbo">最好 <b id="t-best">0</b></span></div>
	</header>
	<div class="session-bar"><span id="session-mode">正式演奏</span><button id="pause-toggle" type="button" aria-controls="pause-dialog" aria-expanded="false" disabled>暂停 · P</button><a id="game-home" href="../我的家.html">回小家</a></div>
	<div id="say">气泡越过金线，就接一口气</div>
	<div id="field"><div id="ring"></div></div>
</div>
<div id="panel"><div class="card" id="pcard">
	<h2>气泡和声</h2>
	<div class="sub">右厢歌唱房 · 跟唱一首</div>
	<div class="rows">歌词化作气泡从水底升起，<br>气泡进入金色音准带时<b>点一下 / 拍一下 / 按空格</b>接唱。<br>靠近中线算完美，带内算跟得上；漏掉的气泡不扣分、断连击。<br><b>一首唱完（28 气泡）记「开嗓」。</b></div>
	<button class="go" id="btn-go">开 嗓</button><button class="go g2" id="btn-pr">练 唱 一 会</button>
	<div><a class="back" id="bk" href="../我的家.html">回小家</a></div>
</div></div>

<dialog id="pause-dialog" aria-labelledby="pause-title"><h2 id="pause-title">暂歇一拍</h2><p>进度留在这里，准备好再继续。<br>离开不会记录这局成绩。</p><button type="button" id="resume-game" autofocus>继续演奏</button><button type="button" id="leave-game">离开本局，回小家</button></dialog>
<script src="../储藏室/结算队列.js"></script>
<script>
"use strict";
var $ = function(id){ return document.getElementById(id); };

var paused = false;
function pauseGame(){
	if (paused || !sessionActive()) return;
	paused = true; freezeGame();
	document.body.classList.add("paused");
	$("pause-toggle").setAttribute("aria-expanded", "true");
	$("pause-dialog").showModal();
	if (ac && ac.state === "running") ac.suspend().catch(function(){});
}
function resumeGame(){
	if (!paused || document.hidden) return;
	paused = false; $("pause-dialog").close();
	document.body.classList.remove("paused");
	$("pause-toggle").setAttribute("aria-expanded", "false");
	AC(); thawGame();
}
function resetPause(active){
	paused = false; $("pause-dialog").close();
	document.body.classList.remove("paused");
	$("pause-toggle").disabled = !active;
	$("pause-toggle").setAttribute("aria-expanded", "false");
	$("session-mode").textContent = practice ? "练习 · 不记录成绩" : "正式演奏";
	$("panel").inert = !!active;
	if (active) $("pause-toggle").focus();
}
$("pause-toggle").onclick = pauseGame;
$("resume-game").onclick = resumeGame;
$("leave-game").onclick = goHome;
$("game-home").onclick = function(e){ e.preventDefault(); goHome(); };
$("pause-dialog").addEventListener("cancel", function(e){ e.preventDefault(); resumeGame(); });
document.addEventListener("visibilitychange", function(){ if (document.hidden) pauseGame(); });

var KEY = "vo_best";
var runId = "vo0"; // 本局局号：结算去重靠它
var LYRIC = "一闪一闪亮晶晶满天都是小星星挂在天上放光明好像许多小眼睛".split("");
var TOTAL = LYRIC.length; // 28
var field = $("field"), ring = $("ring");
var bubs = [], score = 0, combo = 0, maxCombo = 0, perfect = 0, good = 0, missed = 0, done = 0;
var playing = false, spawnIv = 0, raf = 0, lastTap = 0, best = 0, songT0 = 0, practice = false, runStarted = 0;
var lastFrame = null, spawnIndex = 0, spawnDeadline = 0, spawnRemaining = 1750;
function sessionActive(){ return playing; }
function scheduleSpawn(ms){
	clearTimeout(spawnIv); spawnDeadline = performance.now() + ms;
	spawnIv = setTimeout(function(){
		if (!playing || paused) return;
		spawn(spawnIndex++);
		if (spawnIndex < TOTAL) scheduleSpawn(1750);
	}, ms);
}
function freezeGame(){
	spawnRemaining = Math.max(0, spawnDeadline - performance.now());
	clearTimeout(spawnIv); cancelAnimationFrame(raf); lastFrame = null;
}
function thawGame(){
	lastFrame = null; lastTap = 0;
	if (spawnIndex < TOTAL) scheduleSpawn(spawnRemaining);
	raf = requestAnimationFrame(tick);
}
try { best = parseInt(localStorage.getItem(KEY), 10) || 0; } catch (e) {}
$("t-best").textContent = best;
var ac = null;
function AC(){ if (!ac) { var C = window.AudioContext || window.webkitAudioContext; if (C) ac = new C(); } if (ac && ac.state === "suspended") ac.resume(); }
function tone(f, dur, vol, type){
	if (!ac) return;
	var t0 = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
	o.type = type || "sine"; o.frequency.value = f;
	g.gain.setValueAtTime(0, t0);
	g.gain.linearRampToValueAtTime(vol || 0.16, t0 + 0.015);
	g.gain.exponentialRampToValueAtTime(0.0001, t0 + (dur || 0.3));
	o.connect(g); g.connect(ac.destination);
	o.start(t0); o.stop(t0 + (dur || 0.3) + 0.05);
}
var MEL = [261.63, 261.63, 392.00, 392.00, 440.00, 440.00, 392.00, 349.23,
           329.63, 329.63, 293.66, 293.66, 261.63]; // 小星星起句，循环滚动
function mel(i){ return MEL[i % MEL.length]; }
function hud(){ $("t-score").textContent = score; $("t-at").textContent = done; $("t-combo").textContent = combo; $("t-best").textContent = best; }
function spawn(i){
	var b = document.createElement("div");
	b.className = "bub";
	b.textContent = LYRIC[i];
	var lane = 0.18 + (i % 5) * 0.16;
	b.style.left = (lane * 100) + "%";
	b.style.top = "108%";
	b.dataset.i = i; b.dataset.st = "up";
	field.appendChild(b);
	b.addEventListener("pointerdown", function(ev){ ev.preventDefault(); tap(); });
	bubs.push({ el: b, y: 1.08, v: (0.00024 + Math.random() * 0.000032) * (practice ? 0.7 : 1), i: i, judged: false });
}
function judgeMark(txt, cls, y, x){
	var m = document.createElement("div");
	m.className = "judge " + cls;
	m.textContent = txt;
	m.style.top = (y * 100) + "%";
	m.style.left = typeof x === "number" ? x + "%" : x;
	field.appendChild(m);
	setTimeout(function(){ m.remove(); }, 520);
}
function tap(){
	if (!playing || paused) return;
	AC();
	var now = Date.now();
	if (now - lastTap < 150) return; // 狂点不算本事
	lastTap = now;
	var ry = 0.44, bestB = null, bd = 1;
	for (var k = 0; k < bubs.length; k++) {
		var b = bubs[k];
		if (b.judged) continue;
		var d = Math.abs(b.y - ry);
		if (d < bd) { bd = d; bestB = b; }
	}
	ring.classList.remove("pulse"); void ring.offsetWidth; ring.classList.add("pulse");
	if (!bestB || bd > 0.16) { combo = 0; hud(); tone(180, 0.12, 0.08, "square"); return; } // 没气泡在圈边，断连击
	bestB.judged = true; done++;
	bestB.el.classList.add("gone");
	setTimeout(function(el){ return function(){ el.remove(); }; }(bestB.el), 240);
	if (bd <= 0.055) { perfect++; score += 90; judgeMark("◎ 完美", "p", bestB.y, bestB.el.style.left); tone(mel(bestB.i) * 2, 0.3, 0.16); }
	else { good++; score += 45; judgeMark("○ 跟住", "g", bestB.y, bestB.el.style.left); tone(mel(bestB.i), 0.26, 0.13); }
	combo++; maxCombo = Math.max(maxCombo, combo);
	score += Math.min(combo, 12) * 4;
	hud();
}
function expire(b){
	b.judged = true; missed++; combo = 0;
	b.el.classList.add("missed");
	setTimeout(function(el){ return function(){ el.remove(); }; }(b.el), 700);
	hud();
}
function tick(now){
	if (!playing || paused) return;
	if (!Number.isFinite(now)) now = performance.now();
	var dt = lastFrame === null ? 0 : Math.max(0, now - lastFrame);
	lastFrame = now;
	// 后台或长卡顿不补跑一大步：保留当前音符，等玩家明确继续。
	if (dt > 250) { pauseGame(); return; }
	for (var k = bubs.length - 1; k >= 0; k--) {
		var b = bubs[k];
		if (b.judged) continue;
		b.y -= b.v * dt;
		b.el.style.top = (b.y * 100) + "%";
		if (b.y < -0.08) expire(b);
	}
	bubs = bubs.filter(function(b){ return !b.judged || b.el.parentNode && !b.el.classList.contains("missed"); });
	if (done + missed >= TOTAL && !bubs.some(function(b){ return !b.judged; })) { finish(); return; }
	raf = requestAnimationFrame(tick);
}
function gradeOf(s){
	if (s >= 2600) return ["领唱", "字字踩在光心上，屋里都是回声。"];
	if (s >= 2000) return ["和声", "稳稳当当，跟着你唱不跑调。"];
	if (s >= 1200) return ["跟唱", "调子在，气口再练练。"];
	if (s >= 500) return ["哼鸣", "嗓子开了，下一遍更大声。"];
	return ["含蓄", "先小声哼两句找找调。"];
}
function finish(){
	if (!playing || paused) return;
	playing = false; resetPause(false);
	cancelAnimationFrame(raf); clearTimeout(spawnIv); lastFrame = null;
	var isDone = done + missed >= TOTAL ? 1 : 0; // 一首唱完（含漏气）即通关事实
	var isNew = !practice && score > best;
	if (isNew && score > 0) { best = score; try { localStorage.setItem(KEY, String(best)); } catch (e) {} }
	hud();
	if (!practice) HouseRuns.enqueue("vo", score, runId, isDone, runStarted);
	var g = gradeOf(score);
	tone(523.25, 0.3, 0.14); setTimeout(function(){ tone(659.25, 0.55, 0.12); }, 200);
	$("pcard").innerHTML =
		'<div style="font-size:26px;letter-spacing:.3em;color:#3a6a9a">' + g[0] + '</div>' +
		'<div class="sub">' + g[1] + (isDone ? " · <b style='color:#3a6a9a'>一首唱完</b>" : "") + (practice ? " · 练习局不入账" : "") + '</div>' +
		'<div class="rows">得分 <b>' + score + "</b> · 唱到 " + done + "/" + TOTAL + "，完美 " + perfect + " · 跟住 " + good +
		" · 漏气 " + missed + "<br>最长连击 " + maxCombo + "<br>" +
		(isNew ? '<span style="color:#3a6a9a">此间新纪录</span>' : "此间最好 " + best) + "</div>" +
		'<button class="go" id="btn-re">再 唱 一 首</button><button class="go g2" id="btn-pr2">继续练习</button>' +
		'<div><a class="back" id="bk" href="../我的家.html">回小家</a></div>';
	$("panel").classList.remove("hide");
	$("btn-re").onclick = function(){ start(false); };
	$("btn-pr2").onclick = function(){ start(true); };
	$("bk").onclick = function(e){ e.preventDefault(); goHome(); };
}
function goHome(){
	playing = false; clearTimeout(spawnIv); cancelAnimationFrame(raf); resetPause(false);
	try { if (window.parent && window.parent !== window) { window.parent.postMessage("zhouse-back", "*"); return; } } catch (e) {}
	location.href = "../我的家.html";
}
function start(pr){
	clearTimeout(spawnIv); cancelAnimationFrame(raf); AC();
	practice = !!pr;
	runStarted = Date.now(); runId = "vo" + runStarted.toString(36) + Math.random().toString(36).slice(2, 6);
	field.querySelectorAll(".bub,.judge").forEach(function(el){ el.remove(); });
	bubs = []; score = 0; combo = 0; maxCombo = 0; perfect = 0; good = 0; missed = 0; done = 0;
	hud(); $("say").innerHTML = practice ? "练习 · 气泡慢三成，不入账" : "小星星 · <b>" + TOTAL + "</b> 口气";
	$("panel").classList.add("hide"); resetPause(true);
	playing = true; lastFrame = null; lastTap = 0; spawnIndex = 0;
	scheduleSpawn(1750);
	tone(392, 0.2, 0.1);
	raf = requestAnimationFrame(tick);
}
$("btn-go").onclick = function(){ start(false); };
$("btn-pr").onclick = function(){ start(true); };
$("bk").onclick = function(e){ e.preventDefault(); goHome(); };
document.addEventListener("keydown", function(e){
	if (paused) return;
	if (e.key === "Escape"){ goHome(); return; }
	if (e.key.toLowerCase() === "p" && !e.repeat) { e.preventDefault(); pauseGame(); return; }
	if (e.repeat || !playing || e.target.closest("button,a,input,select,textarea")) return;
	if (e.key === " " || e.key === "Enter") { e.preventDefault(); tap(); }
});
field.addEventListener("pointerdown", function(ev){ if (ev.target === field || ev.target === ring) tap(); });
</script>
</body>
</html>
