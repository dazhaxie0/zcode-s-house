<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>乐理课 · 钢琴房</title>
<style>
:root{
	--paper:#efe6d4; --ink:#2c2318; --wood:#b57a42; --wood2:#8a5a2e; --gold:#d9a441; --red:#c93b2e;
	--ok:#6a9e5f; --line:#4a3d2a; --dim:#9c8a68;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
	background:radial-gradient(120% 90% at 50% 0%,#3a3022 0%,#241c12 55%,#161006 100%);
	color:var(--paper);font-family:"Kaiti SC",KaiTi,STKaiti,"Noto Serif SC",serif;
	overflow:hidden;touch-action:manipulation;
}
#stage{position:fixed;inset:0;display:flex;flex-direction:column;max-width:760px;margin:0 auto;
	padding:max(8px,env(safe-area-inset-top)) 12px max(8px,env(safe-area-inset-bottom))}
header{display:flex;align-items:baseline;gap:12px;flex:none;flex-wrap:wrap;padding:2px 2px 6px}
header h1{font-size:17px;letter-spacing:.35em;color:var(--gold);font-weight:600}
#hud{margin-left:auto;font-size:13px;color:#d8c9a8;white-space:nowrap}
#hud b{color:#fff;font-size:16px;font-family:Georgia,"Microsoft YaHei",serif}
.session-bar{display:flex;align-items:center;justify-content:flex-end;gap:10px;flex:none;min-height:34px}
.session-bar button,.session-bar a{font:inherit;font-size:13px;color:#f3dfb3;background:#352b25;border:1px solid #a58b54;border-radius:7px;padding:6px 11px;text-decoration:none;cursor:pointer}
.session-bar button:disabled{opacity:.4;cursor:default}
.session-bar span{margin-right:auto;font-size:12px;color:#cdb98e}
button:focus-visible,a:focus-visible{outline:3px solid #ffe2a2;outline-offset:2px}
#tabs{display:flex;gap:6px;flex:none;padding:6px 0}
#tabs button{flex:1;font:inherit;font-size:14px;letter-spacing:.14em;padding:8px 2px;cursor:pointer;
	color:#cdb98e;background:#2b2318;border:1px solid #57482f;border-radius:9px;position:relative}
#tabs button.on{color:#2c2318;background:linear-gradient(180deg,#f0cd7c,#d9a441);border-color:#f0cd7c;font-weight:700}
#tabs button i{position:absolute;right:5px;top:4px;width:6px;height:6px;border-radius:50%;background:var(--ok);display:none}
#tabs button.master i{display:block}
#main{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:4px 2px 18px;scrollbar-width:thin}
.pane{display:none}.pane.on{display:block}
.note{background:#241d13;border:1px solid #4a3d2a;border-left:3px solid var(--gold);border-radius:8px;
	padding:10px 12px;font-size:13.5px;line-height:1.95;color:#d9c9a6;margin-bottom:10px}
.note b{color:var(--gold);font-weight:600}
.note em{color:#f0e2c0;font-style:normal}
.note .src{display:block;margin-top:4px;font-size:11.5px;color:#7d6c50;letter-spacing:.06em}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chips button{font:inherit;font-size:12.5px;padding:6px 10px;border-radius:16px;cursor:pointer;
	color:#cdb98e;background:#2b2318;border:1px solid #57482f}
.chips button.on{color:#2c2318;background:#e3bb63;border-color:#e3bb63;font-weight:700}
.chips button:disabled{opacity:.45;cursor:default}
#say,.say{min-height:30px;display:flex;align-items:center;justify-content:center;text-align:center;
	font-size:14.5px;line-height:1.7;color:#cdb98e;padding:4px 6px;letter-spacing:.04em}
.say b{color:var(--gold)}.say.good{color:#bfe0a8}.say.bad{color:#e8a496}
.stagebox{background:#1d1710;border:1px solid #443826;border-radius:10px;padding:12px;margin-bottom:10px}
.q{font-size:15.5px;line-height:1.8;color:#f0e2c0;text-align:center;margin-bottom:12px;letter-spacing:.04em}
.q b{color:var(--gold)}
.opts{display:grid;gap:8px}
.opts button{font:inherit;font-size:14.5px;line-height:1.6;padding:11px 12px;border-radius:9px;cursor:pointer;
	text-align:left;color:#e6d8b8;background:#2e2618;border:1px solid #5d4c31}
.opts button:hover{border-color:#a58b54}
.opts button.right{background:#33452c;border-color:var(--ok);color:#dff0cd}
.opts button.wrong{background:#4a2c25;border-color:var(--red);color:#f0cdc2}
.opts button:disabled{cursor:default}
.why{margin-top:10px;font-size:13px;line-height:1.9;color:#c3b18d;border-top:1px dashed #4a3d2a;padding-top:9px}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.act{font:inherit;font-size:14px;letter-spacing:.18em;padding:10px 22px;border-radius:9px;cursor:pointer;
	color:#2c2318;background:linear-gradient(180deg,#e8b455,#c98f2e);border:none;box-shadow:0 3px 0 #8a5a1e}
.act:active{transform:translateY(2px);box-shadow:0 1px 0 #8a5a1e}
.act.g2{background:none;box-shadow:none;border:1px solid #a58b54;color:#f3dfb3}
.act:disabled{opacity:.45;cursor:default;transform:none}
.meter{display:flex;align-items:center;gap:10px;font-size:12.5px;color:#cdb98e;flex-wrap:wrap;justify-content:center}
.meter input[type=range]{width:130px;accent-color:var(--gold)}
.meter b{color:var(--gold);font-family:Georgia,serif;font-size:15px}
.prog{display:flex;gap:5px;justify-content:center;margin:8px 0}
.prog i{width:11px;height:11px;border-radius:50%;background:#3a3122;border:1px solid #5d4c31;display:block}
.prog i.ok{background:var(--ok);border-color:var(--ok)}
.prog i.no{background:var(--red);border-color:var(--red)}
.prog i.cur{border-color:var(--gold);box-shadow:0 0 0 2px rgba(217,164,65,.28)}
.stat{display:flex;gap:16px;justify-content:center;font-size:12.5px;color:var(--dim);flex-wrap:wrap;margin-top:8px}
.stat b{color:#e6d8b8;font-family:Georgia,serif}
/* 键盘 */
.kbwrap{overflow-x:auto;overflow-y:hidden;padding:6px 0 2px;scrollbar-width:thin}
.kb{position:relative;height:132px;margin:0 auto}
.kb .wk{position:absolute;top:0;bottom:0;border-radius:0 0 6px 6px;cursor:pointer;
	background:linear-gradient(180deg,#f7f1e0 0%,#e8dfc8 82%,#cfc3a6 100%);
	box-shadow:inset -1px 0 0 #b9ac8d, inset 0 -5px 7px rgba(0,0,0,.12);
	display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding-bottom:5px}
.kb .bk{position:absolute;top:0;height:62%;border-radius:0 0 5px 5px;cursor:pointer;z-index:2;
	background:linear-gradient(180deg,#3a3129 0%,#191510 88%);box-shadow:0 3px 4px rgba(0,0,0,.5), inset 0 -3px 4px rgba(255,255,255,.08)}
.kb .wk span,.kb .bk span{font-size:10.5px;line-height:1.35;color:#8a7458;font-family:Georgia,"Microsoft YaHei",serif;pointer-events:none;text-align:center}
.kb .bk span{color:#a5936c;font-size:9.5px;position:absolute;bottom:4px;left:0;right:0}
.kb .wk span.sg{color:#a8622e;font-size:11px}
.kb .wk span.pc{font-size:9px;color:#a89468}
.kb .wk.lit,.kb .bk.lit{background:linear-gradient(180deg,#ffe9b0,#e8b84e)}
.kb .wk.ok,.kb .bk.ok{background:linear-gradient(180deg,#cfe6b4,#8fbf72)}
.kb .wk.bad,.kb .bk.bad{background:linear-gradient(180deg,#e8b0a4,#c06a58)}
.kb .wk.hint,.kb .bk.hint{box-shadow:inset 0 0 0 2px var(--gold)}
.kb .wk.down,.kb .bk.down{transform:translateY(2px)}
.kb .grp{position:absolute;top:-2px;font-size:10px;color:#7d6c50;letter-spacing:.08em;pointer-events:none}
.kb .mid{position:absolute;top:0;bottom:0;width:2px;background:rgba(217,164,65,.45);pointer-events:none;z-index:3}
/* 节奏谱 */
.rhythm{overflow-x:auto;padding:4px 0}
.rhythm svg{display:block;margin:0 auto}
.vhand{display:flex;justify-content:center;align-items:center;gap:14px;margin:6px 0}
.vhand svg{overflow:visible}
.beatdots{display:flex;gap:8px;justify-content:center;margin:6px 0}
.beatdots i{width:26px;height:26px;border-radius:50%;border:1px solid #5d4c31;background:#2b2318;
	display:flex;align-items:center;justify-content:center;font-size:11px;color:#9c8a68;font-style:normal}
.beatdots i.s{background:#e3bb63;color:#2c2318;border-color:#e3bb63;font-weight:700}
.beatdots i.w{background:#3d4a35;color:#cfe0bd;border-color:#6a9e5f}
.beatdots i.now{box-shadow:0 0 0 3px rgba(217,164,65,.35)}
.judge{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.judge span{font-size:11px;padding:3px 7px;border-radius:11px;background:#2b2318;border:1px solid #5d4c31;color:#9c8a68}
.judge span.p{background:#33452c;border-color:var(--ok);color:#dff0cd}
.judge span.g{background:#4a4227;border-color:var(--gold);color:#f0e2c0}
.judge span.m{background:#4a2c25;border-color:var(--red);color:#f0cdc2}
.legend{font-size:11.5px;color:#7d6c50;text-align:center;line-height:1.9;margin-top:6px}
.gl{font-size:11.5px;color:#8a7458;letter-spacing:.18em;margin:9px 0 4px}
.pad{display:block;width:100%;margin-top:10px;padding:18px;border-radius:12px;border:1px solid #a58b54;
	background:linear-gradient(180deg,#3a3122,#241d13);color:#f0e2c0;font:inherit;font-size:16px;letter-spacing:.3em;cursor:pointer}
.pad.down{background:linear-gradient(180deg,#e8b455,#c98f2e);color:#2c2318}
.pad:disabled{opacity:.4;cursor:default}
.tbl{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px}
.tbl th,.tbl td{border:1px solid #443826;padding:4px 5px;text-align:center;color:#d9c9a6}
.tbl th{color:var(--gold);font-weight:600;background:#241d13}
.tbl td.hot{color:#f0cdc2;border-color:#8a5a3e}
.tbl td.bk{background:#191510;color:#a5936c}
details.ref{margin-bottom:10px}
details.ref summary{cursor:pointer;font-size:13px;color:var(--gold);letter-spacing:.1em;padding:6px 0}
#pause-dialog{margin:auto;max-width:calc(100vw - 32px);width:360px;border:1px solid #aa884b;border-radius:16px;padding:28px 24px;color:#f5e6ca;background:#29231f;text-align:center;box-shadow:0 20px 80px #0009}
#pause-dialog::backdrop{background:#080b13bc;backdrop-filter:blur(3px)}
#pause-dialog h2{font-size:24px;margin-bottom:12px}#pause-dialog p{line-height:1.8;font-size:14px;margin-bottom:14px}
#pause-dialog button{display:block;margin:10px auto 0;width:100%;padding:12px;border-radius:8px;border:1px solid #b58c45;font:inherit;cursor:pointer;background:#d6a14c;color:#211a10}
#pause-dialog #leave-game{background:transparent;color:#e9d9b9}
body.paused *,body.paused *::before,body.paused *::after{animation-play-state:paused!important}
@media (max-width:520px){
	#stage{padding-left:8px;padding-right:8px}
	header h1{font-size:15px;letter-spacing:.24em}
	#tabs button{font-size:12.5px;letter-spacing:.06em;padding:8px 1px}
	.kb{height:112px}
	.note{font-size:12.5px;line-height:1.9}
	.q{font-size:14.5px}
	.opts button{font-size:13.5px;padding:10px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="stage">
	<header><h1>乐理课</h1><div id="hud">日课掌握 <b id="t-master">0</b>/4 门 · 练过 <b id="t-tries">0</b> 回</div></header>
	<div class="session-bar"><span id="session-mode">日课 · 本地进度，不入星尘账</span><button id="pause-toggle" type="button" aria-controls="pause-dialog" aria-expanded="false" disabled>暂停 · P</button><a id="game-home" href="../我的家.html">回小家</a></div>
	<nav id="tabs" aria-label="课目">
		<button type="button" data-k="key" class="on">调号<i></i></button>
		<button type="button" data-k="meter">拍号<i></i></button>
		<button type="button" data-k="beat">打拍子<i></i></button>
		<button type="button" data-k="finger">指法<i></i></button>
	</nav>
	<main id="main">
		<section class="pane on" id="p-key"></section>
		<section class="pane" id="p-meter"></section>
		<section class="pane" id="p-beat"></section>
		<section class="pane" id="p-finger"></section>
	</main>
</div>
<dialog id="pause-dialog" aria-labelledby="pause-title"><h2 id="pause-title">暂歇一拍</h2><p>拍子替你留着，进度留在这里。<br>日课不入账，离开也不扣什么。</p><button type="button" id="resume-game" autofocus>继续日课</button><button type="button" id="leave-game">离开，回小家</button></dialog>
<script>
"use strict";
var $ = function(id){ return document.getElementById(id); };
function el(tag, cls, html){ var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
function shuffle(a){ a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

/* ---------- 本地进度：日课不入星尘账，只记自己练到哪 ---------- */
var PKEY = "ml_prog";
var prog = {};
try { prog = JSON.parse(localStorage.getItem(PKEY) || "{}") || {}; } catch (e) { prog = {}; }
function saveProg(){ try { localStorage.setItem(PKEY, JSON.stringify(prog)); } catch (e) {} }
function rec(id){ if (!prog[id]) prog[id] = { n:0, best:0, last:0 }; return prog[id]; }
function mark(id, pct){
	var r = rec(id); r.n++; r.last = Math.round(pct);
	if (pct > r.best) r.best = Math.round(pct);
	saveProg(); hud();
}
var LESSON = { key:[], meter:[], beat:[], finger:[] };
function mastery(k){
	var ids = LESSON[k]; if (!ids.length) return false;
	for (var i = 0; i < ids.length; i++) { var r = prog[ids[i]]; if (!r || !r.n || r.best < 80) return false; }
	return true;
}
function hud(){
	var m = 0, tries = 0;
	for (var k in LESSON) if (mastery(k)) m++;
	for (var id in prog) tries += prog[id].n || 0;
	$("t-master").textContent = m; $("t-tries").textContent = tries;
	var bs = $("tabs").children;
	for (var i = 0; i < bs.length; i++) bs[i].classList.toggle("master", mastery(bs[i].dataset.k));
}

/* ---------- 声音 ---------- */
var ac = null;
function AC(){
	if (!ac) { var C = window.AudioContext || window.webkitAudioContext; if (C) ac = new C(); }
	if (ac && ac.state === "suspended") ac.resume();
	return ac;
}
function freq(m){ return 440 * Math.pow(2, (m - 69) / 12); }
function tone(m, dur, vol, type, when){
	if (!ac) return;
	var t0 = when || ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
	o.type = type || "triangle"; o.frequency.value = typeof m === "number" && m > 200 ? m : freq(m);
	g.gain.setValueAtTime(0, t0);
	g.gain.linearRampToValueAtTime(vol == null ? 0.2 : vol, t0 + 0.012);
	g.gain.exponentialRampToValueAtTime(0.0001, t0 + (dur || 0.4));
	o.connect(g); g.connect(ac.destination);
	o.start(t0); o.stop(t0 + (dur || 0.4) + 0.05);
}
function click(level, when){
	if (!ac) return;
	var t0 = when || ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
	o.type = "square"; o.frequency.value = level >= 2 ? 1560 : (level >= 1 ? 980 : 740);
	g.gain.setValueAtTime(level >= 2 ? 0.12 : (level >= 1 ? 0.06 : 0.03), t0);
	g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.045);
	o.connect(g); g.connect(ac.destination); o.start(t0); o.stop(t0 + 0.06);
}
function buzz(){ tone(110, 0.32, 0.16, "square"); }
function ding(){ tone(84, 0.4, 0.13); setTimeout(function(){ tone(88, 0.5, 0.11); }, 130); }

/* ---------- 全屋同一条暂停契约 ---------- */
var paused = false, pauseAt = 0, generation = 0, litT = [], running = false;
function sessionActive(){ return running; }
function schedule(fn, delay){
	var task = { fn:fn, left:delay, due:0, id:0, gen:generation };
	litT.push(task); arm(task); return task;
}
function arm(task){
	task.due = Date.now() + task.left;
	task.id = setTimeout(function(){
		if (paused || task.gen !== generation) return;
		litT = litT.filter(function(t){ return t !== task; }); task.fn();
	}, task.left);
}
function clearTasks(){ litT.forEach(function(t){ clearTimeout(t.id); }); litT = []; generation++; }
function freezeGame(){
	pauseAt = Date.now();
	litT.forEach(function(t){ clearTimeout(t.id); t.left = Math.max(0, t.due - pauseAt); });
	if (cond.on) cond.pausedAt = pauseAt;
}
function thawGame(){
	if (cond.on) cond.t0 += Date.now() - cond.pausedAt;
	litT.forEach(arm);
}
function setRunning(on){
	running = !!on;
	$("pause-toggle").disabled = !on;
	if (!on) { $("pause-toggle").setAttribute("aria-expanded","false"); }
}
function pauseGame(){
	if (paused || !sessionActive()) return;
	paused = true; freezeGame();
	document.body.classList.add("paused");
	$("pause-toggle").setAttribute("aria-expanded","true");
	$("pause-dialog").showModal();
	if (ac && ac.state === "running") ac.suspend().catch(function(){});
}
function resumeGame(){
	if (!paused || document.hidden) return;
	paused = false; $("pause-dialog").close();
	document.body.classList.remove("paused");
	$("pause-toggle").setAttribute("aria-expanded","false");
	AC(); thawGame();
}
function resetPause(){
	paused = false; $("pause-dialog").close();
	document.body.classList.remove("paused");
	setRunning(false);
}
$("pause-toggle").onclick = pauseGame;
$("resume-game").onclick = resumeGame;
$("leave-game").onclick = goHome;
$("game-home").onclick = function(e){ e.preventDefault(); goHome(); };
$("pause-dialog").addEventListener("cancel", function(e){ e.preventDefault(); resumeGame(); });
document.addEventListener("visibilitychange", function(){ if (document.hidden) pauseGame(); });
function goHome(){
	stopAll(); resetPause();
	try { if (window.parent && window.parent !== window) { window.parent.postMessage("zhouse-back","*"); return; } } catch (e) {}
	location.href = "../我的家.html";
}

/* ---------- 音名表：科学音高 ↔ 亥姆霍兹 ↔ 组名（笔记 A2~c1~c5 / A0~C4~C8） ---------- */
var LETTER = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
var WHITE = [0,2,4,5,7,9,11];
var GROUP = ["大字二组","大字一组","大字组","小字组","小字一组","小字二组","小字三组","小字四组","小字五组"];
var SUP = ["","¹","²","³","⁴","⁵","⁶","⁷","⁸"];
var SUB = ["","₁","₂","₃","₄","₅"];
function sci(m){ return LETTER[(m % 12 + 12) % 12] + (Math.floor(m / 12) - 1); }
function helm(m){
	var o = Math.floor(m / 12) - 1, L = LETTER[(m % 12 + 12) % 12], base = L.replace("#","");
	var sharp = L.indexOf("#") >= 0 ? "♯" : "";
	if (o <= 0) return base + sharp + SUB[2];
	if (o === 1) return base + sharp + SUB[1];
	if (o === 2) return base + sharp;
	return base.toLowerCase() + sharp + SUP[o - 3];
}
function helmPlain(m){
	var o = Math.floor(m / 12) - 1, L = LETTER[(m % 12 + 12) % 12], base = L.replace("#","");
	if (o <= 0) return base + "2";
	if (o === 1) return base + "1";
	if (o === 2) return base;
	return base.toLowerCase() + (o - 3);
}
function groupOf(m){ return GROUP[Math.min(8, Math.max(0, Math.floor(m / 12) - 1))]; }
function isBlack(m){ return WHITE.indexOf((m % 12 + 12) % 12) < 0; }
var SOLF = ["Do","Re","Mi","Fa","Sol","La","Ti"];
var MAJOR = [0,2,4,5,7,9,11];
/* 课程半音阶唱名表：[本位, 降名, 升名]。红框重点 b1 De、b4 Fe、#3 Ma、#7 To */
var CHROM = [
	["Do","","To"],["","De","Di"],["Re","",""],["","Ra","Ri"],["Mi","Me",""],["Fa","","Ma"],
	["","Fe","Fi"],["Sol","",""],["","Se","Si"],["La","",""],["","Le","Li"],["Ti","Te",""]
];
function solfFixed(m){
	var c = CHROM[(m % 12 + 12) % 12];
	return c[0] || c[2] || c[1];
}
function solfMovable(m, tonic){
	var d = ((m - tonic) % 12 + 12) % 12, i = MAJOR.indexOf(d);
	if (i >= 0) return String(i + 1);
	return "#" + (MAJOR.indexOf(d - 1) + 1);
}

/* ---------- 键盘组件 ---------- */
var curTonic = 60, labelMode = "both", solfMode = "off";
function buildKB(host, lo, hi, onTap){
	host.innerHTML = "";
	var wrap = el("div","kbwrap"), kb = el("div","kb");
	var ww = window.innerWidth < 520 ? 27 : 34, bw = Math.round(ww * 0.62);
	var whites = 0, i, m;
	for (m = lo; m <= hi; m++) if (!isBlack(m)) whites++;
	kb.style.width = (whites * ww) + "px";
	var wi = 0, nodes = {};
	for (m = lo; m <= hi; m++) {
		var b = isBlack(m), k = el("div", b ? "bk" : "wk");
		k.dataset.m = m;
		if (b) { k.style.left = (wi * ww - bw / 2) + "px"; k.style.width = bw + "px"; }

/* ---------- 选择题引擎 ---------- */
function quizSession(host, drillId, bank, n, done){
	var qs = shuffle(bank).slice(0, n || 6), qi = 0, right = 0, dots = el("div","prog");
	host.innerHTML = ""; host.appendChild(dots);
	var box = el("div","stagebox"), say = el("div","say");
	host.appendChild(box); host.appendChild(say);
	function paintDots(){
		dots.innerHTML = "";
		qs.forEach(function(_, i){
			var d = el("i"); if (i < qi) d.className = qs[i].got ? "ok" : "no";
			if (i === qi) d.classList.add("cur");
			dots.appendChild(d);
		});
	}
	function show(){
		paintDots();
		var q = qs[qi];
		box.innerHTML = "";
		box.appendChild(el("div","q", "第 <b>" + (qi + 1) + "</b>/" + qs.length + " 题 · " + q.q));
		var opts = el("div","opts");
		var order = shuffle(q.o.map(function(t, i){ return { t:t, i:i }; }));
		order.forEach(function(o){
			var b = el("button", null, esc(o.t));
			b.onclick = function(){
				if (box.dataset.lock) return;
				box.dataset.lock = "1";
				var good = o.i === q.a;
				q.got = good; if (good) right++;
				Array.prototype.forEach.call(opts.children, function(c, ci){
					c.disabled = true;
					if (order[ci].i === q.a) c.classList.add("right");
					else if (c === b) c.classList.add("wrong");
				});
				if (good) { ding(); say.className = "say good"; say.innerHTML = "对了 · <b>" + esc(q.o[q.a]) + "</b>"; }
				else { buzz(); say.className = "say bad"; say.innerHTML = "答案是 <b>" + esc(q.o[q.a]) + "</b>"; }
				var w = el("div","why", q.why || "");
				var row = el("div","row");
				var nx = el("button","act", qi + 1 < qs.length ? "下 一 题" : "看 成 绩");
				nx.onclick = function(){ qi++; box.dataset.lock = ""; if (qi < qs.length) show(); else finish(); };
				row.appendChild(nx); box.appendChild(w); box.appendChild(row);
				paintDots();
				nx.focus();
			};
			opts.appendChild(b);
		});
		box.appendChild(opts);
		say.className = "say"; say.innerHTML = "选一个 · 答错也讲明白";
	}
	function finish(){
		var pct = Math.round(right / qs.length * 100);
		mark(drillId, pct);
		box.innerHTML = "";
		box.appendChild(el("div","q", "这一轮 <b>" + right + "/" + qs.length + "</b> · 正确率 <b>" + pct + "%</b>"));
		box.appendChild(el("div","why", pct >= 80 ? "这门算摸熟了，隔几天再回来过一遍，别让它生。" : "八成算熟。错的几题上面都写了缘由，再来一轮就顺了。"));
		var row = el("div","row");
		var again = el("button","act","再 来 一 轮");
		again.onclick = function(){ quizSession(host, drillId, bank, n, done); };
		row.appendChild(again);
		if (done) row.appendChild(done());
		box.appendChild(row);
		say.className = "say"; say.innerHTML = "日课记在本地，不进星尘账";
		dots.innerHTML = "";
		(again).focus();
	}
	show();
	return { stop:function(){ box.dataset.lock = "1"; } };
}

var PXB = 76;
function noteGlyph(x, dur, dot){
	var s = "", hollow = dur >= 2, head = "<ellipse cx='" + (x + 7) + "' cy='30' rx='6.6' ry='4.8' transform='rotate(-18 " + (x + 7) + " 30)' fill='" + (hollow ? "none" : "#efe6d4") + "' stroke='#efe6d4' stroke-width='" + (hollow ? 2 : 1) + "'/>";
	s += head;
	if (dur < 4) s += "<line x1='" + (x + 13) + "' y1='28' x2='" + (x + 13) + "' y2='4' stroke='#efe6d4' stroke-width='1.8'/>";
	var flags = dur <= 0.25 ? 2 : (dur <= 0.5 ? 1 : 0);
	for (var f = 0; f < flags; f++)
		s += "<path d='M" + (x + 13) + " " + (4 + f * 7) + " q9 3 6 11' fill='none' stroke='#efe6d4' stroke-width='1.8'/>";
	if (dot) s += "<circle cx='" + (x + 21) + "' cy='30' r='2.1' fill='#d9a441'/>";
	if (dot === 2) s += "<circle cx='" + (x + 27) + "' cy='30' r='2.1' fill='#d9a441'/>";
	return s;
}
function restGlyph(x, dur){
	var c = "#cdb98e";
	if (dur >= 4) return "<rect x='" + (x + 3) + "' y='22' width='14' height='5' fill='" + c + "'/><line x1='" + (x - 2) + "' y1='22' x2='" + (x + 22) + "' y2='22' stroke='" + c + "' stroke-width='1'/>";
	if (dur >= 2) return "<rect x='" + (x + 3) + "' y='27' width='14' height='5' fill='" + c + "'/><line x1='" + (x - 2) + "' y1='32' x2='" + (x + 22) + "' y2='32' stroke='" + c + "' stroke-width='1'/>";
	if (dur >= 1) return "<path d='M" + (x + 10) + " 12 l-6 9 l7 4 l-6 10 q7 -3 6 -9 l-6 -4 z' fill='" + c + "'/>";
	if (dur >= 0.5) return "<path d='M" + (x + 14) + " 18 q-8 1 -7 7 q1 4 5 3 l-4 9' fill='none' stroke='" + c + "' stroke-width='2.2'/><circle cx='" + (x + 11) + "' cy='20' r='2.4' fill='" + c + "'/>";

}
function sylAt(t){
	var f = ((t % 1) + 1) % 1;

}
function handAt(t){
	var f = ((t % 1) + 1) % 1;

	if (Math.abs(f - 0.5) < 1e-6) return ["顶点", "#8fbf72"];

function rhythmSVG(pat, opts){
	opts = opts || {};
	var pxb = opts.pxb || PXB, beats = pat.beats;
	var W = Math.max(240, beats * pxb + 40), H = 100;
	var s = "<svg viewBox='0 0 " + W + " " + H + "' width='" + W + "' height='" + H + "' role='img' aria-label='" + esc(pat.n) + " 节奏谱'>";
	for (var b = 0; b <= beats; b++) {

		s += "<line x1='" + x + "' y1='2' x2='" + x + "' y2='42' stroke='#5d4c31' stroke-width='1'/>";
		if (b < beats) {
			s += "<line x1='" + (x + pxb / 2) + "' y1='10' x2='" + (x + pxb / 2) + "' y2='42' stroke='#3a3122' stroke-width='1' stroke-dasharray='3 3'/>";

				s += "<line x1='" + (x + pxb / 4) + "' y1='24' x2='" + (x + pxb / 4) + "' y2='42' stroke='#2f281c' stroke-width='1'/>";

			}

		if (b < beats) s += "<text x='" + (x + 3) + "' y='56' font-size='10' fill='#7d6c50'>" + (b + 1) + "</text>";
	}
	pat.notes.forEach(function(n, ni){
		var x = 20 + n[0] * pxb, rest = n[3];
		s += rest ? restGlyph(x, n[1]) : noteGlyph(x, n[1], n[2] || 0);
		var lab = opts.numeric ? (rest ? "0" : String(n[4] || "")) + (n[1] >= 2 && !rest ? new Array(Math.round(n[1])).join("－") : "") : (rest ? "空" : sylAt(n[0]));

	});

	s += "</svg>";
	return s;
}

/* ---------- 指挥器：拍点音频提前排，视觉走 rAF；暂停整体平移 ---------- */
var cond = { on:false, t0:0, bpm:80, events:[], ei:0, raf:0, iv:0, pausedAt:0, onBeat:null, onEnd:null, beats:0 };
function condStart(bpm, events, beats, onBeat, onEnd){
	condStop();
	cond.on = true; cond.bpm = bpm; cond.events = events; cond.ei = 0; cond.beats = beats;
	cond.onBeat = onBeat; cond.onEnd = onEnd; cond.t0 = Date.now();
	setRunning(true);
	cond.iv = setInterval(condAudio, 40);
	cond.raf = requestAnimationFrame(condFrame);
}
function condStop(){
	cond.on = false; clearInterval(cond.iv); cancelAnimationFrame(cond.raf);
	cond.iv = cond.raf = 0; setRunning(false);
}
function condAudio(){
	if (!cond.on || paused || !ac) return;
	var now = Date.now(), horizon = now + 140;
	while (cond.ei < cond.events.length) {
		var e = cond.events[cond.ei], at = cond.t0 + e.t;
		if (at > horizon) break;
		var when = ac.currentTime + Math.max(0, at - now) / 1000;
		if (e.f) tone(e.f, e.d || 0.28, e.v == null ? 0.17 : e.v, e.w || "triangle", when);
		if (e.c != null) click(e.c, when);
		cond.ei++;
	}
}
function condFrame(){
	if (!cond.on) return;
	cond.raf = requestAnimationFrame(condFrame);
	if (paused) return;
	var t = Date.now() - cond.t0;
	if (cond.onBeat) cond.onBeat(t);
	if (t >= cond.beats * 60000 / cond.bpm + 260) { var f = cond.onEnd; condStop(); if (f) f(); }
}

function stopAll(){ condStop(); clearTasks(); }

	KEYS.forEach(function(k, i){

	}
	function paint(){
		dots.innerHTML = "";
		for (var i = 0; i < 7; i++) { var d = el("i"); if (i < step) d.className = "ok"; if (i === step) d.classList.add("cur"); dots.appendChild(d); }
	}

		if (m === want[step]) {
			kb.cls(m, "ok"); tone(m, 0.45, 0.2);
			step++; paint();
			if (step >= 7) {
				locked = true;
				var pct = Math.round(7 / (7 + errs) * 100); mark("key-scale", pct);

				nx.onclick = function(){ ki = (ki + 1) % KEYS.length; begin(); };

			errs++; kb.cls(m, "bad"); buzz();

			schedule(function(){ kb.cls(m, ""); }, 480);
		}
	}
	begin();
	return { stop:function(){ locked = true; } };
}

		"<em>延音线</em>连同音高、时值相加只弹一次；<em>连线</em>连不同音高、讲圆滑与乐句。<br>" +

function drillAccent(host){
	var box = el("div","stagebox"), say = el("div","say");
	host.appendChild(box); host.appendChild(say);
	var qEl = el("div","q"), dots = el("div","prog"), opts = el("div","opts"), row = el("div","row");
	box.appendChild(qEl); box.appendChild(dots); box.appendChild(opts); box.appendChild(row);
	var pool = shuffle(METERS.filter(function(m){ return ["2/4","3/4","4/4","6/8"].indexOf(m.n) >= 0; }));
	var N = 4, qi = 0, right = 0, seen = [], locked = false;
	var listen = el("button","act","听 一 遍"), replay = el("button","act g2","再 听");
	row.appendChild(listen); row.appendChild(replay);
	replay.disabled = true;
	function paint(){
		dots.innerHTML = "";
		for (var i = 0; i < N; i++) { var d = el("i"); if (i < qi) d.className = seen[i] ? "ok" : "no"; if (i === qi) d.classList.add("cur"); dots.appendChild(d); }
	}
	function play(){
		if (locked) return;
		AC();
		var m = pool[qi % pool.length], bm = beatMs(84), ev = [], b;
		for (b = 0; b < m.num * 2; b++) ev.push({ t: b * bm, c: m.acc[b % m.num] });
		condStart(84, ev, m.num * 2, function(t){
			var bi = Math.floor(t / bm);
			var ds = dots.nextSibling;
			if (meterDots) paintMeter(m, bi);
		}, function(){ replay.disabled = false; });
		listen.disabled = true;
		buildMeterDots(m);
		say.className = "say"; say.innerHTML = "听强弱 · 数一数几拍一循环";
	}
	var meterDots = null;
	function buildMeterDots(m){
		if (meterDots) meterDots.remove();
		meterDots = el("div","beatdots");
		m.acc.forEach(function(a){ meterDots.appendChild(el("i", a === 2 ? "s" : (a === 3 ? "w" : ""), a === 2 ? "强" : (a === 3 ? "次" : "弱"))); });
		box.insertBefore(meterDots, opts);
	}
	function paintMeter(m, bi){
		if (!meterDots) return;
		Array.prototype.forEach.call(meterDots.children, function(c, i){ c.classList.toggle("now", i === bi % m.num); });
	}
	function next(){
		opts.innerHTML = ""; locked = false; replay.disabled = true; listen.disabled = false;
		if (meterDots) { meterDots.remove(); meterDots = null; }
		if (qi >= N) return fin();
		paint();
		var m = pool[qi % pool.length];
		qEl.innerHTML = "第 <b>" + (qi + 1) + "</b>/" + N + " 段 · 这是几拍子？";
		shuffle(["2/4","3/4","4/4","6/8"]).forEach(function(n){
			var b = el("button", null, n);
			b.onclick = function(){
				if (locked) return; locked = true; condStop();
				var good = n === m.n; seen.push(good); if (good) right++;
				Array.prototype.forEach.call(opts.children, function(c){ c.disabled = true; if (c.textContent === m.n) c.classList.add("right"); else if (c === b) c.classList.add("wrong"); });
				buildMeterDots(m);
				if (good) { ding(); say.className = "say good"; say.innerHTML = "对了 · <b>" + m.n + "</b>：" + m.txt; }
				else { buzz(); say.className = "say bad"; say.innerHTML = "是 <b>" + m.n + "</b>：" + m.txt; }
				schedule(function(){ qi++; next(); }, 1500);
			};
			opts.appendChild(b);
		});
		say.className = "say"; say.innerHTML = "先点「听一遍」，再选拍号";
	}
	function fin(){
		var pct = Math.round(right / N * 100); mark("meter-accent", pct);
		qEl.innerHTML = "听辨 <b>" + right + "/" + N + "</b> · <b>" + pct + "%</b>";
		opts.innerHTML = ""; dots.innerHTML = ""; row.innerHTML = "";
		box.appendChild(el("div","why","强拍是循环的起点：2/4 两拍一循环，3/4 三拍，4/4 四拍且第三拍次强，6/8 六拍且第四拍次强。"));
		var again = el("button","act","再 听 一 轮");
		again.onclick = function(){ host.innerHTML = ""; drillAccent(host); };
		row.appendChild(again); box.appendChild(row); again.focus();
		say.className = "say"; say.innerHTML = "听不出来就先看强弱点跟着数";
	}
	listen.onclick = play; replay.onclick = play;
	next();
	return { stop:function(){ locked = true; condStop(); } };
}

		fKB.clear();
		Array.prototype.forEach.call(chips.children, function(b, i){ b.classList.toggle("on", i === fIdx); });
		paintMode(); paintF();
		var r = prog[d.id];
		stat.innerHTML = r && r.n ? "练过 <b>" + r.n + "</b> 回 · 最佳 <b>" + r.best + "%</b>" : "还没练过这一条";
		say.className = "say"; say.innerHTML = d.chord ? "三个音一起按（顺序不限）" : "按亮起的指法弹下一个音";
	}
	function paintF(){
		var d = FINGERS[fIdx], n = d.chord ? d.chords.length : d.seq.length;
		qEl.innerHTML = "<b>" + d.n + "</b> · " + d.hand + (d.chord ? "" : " · 第 " + (Math.min(fStep, n - 1) + 1) + "/" + n + " 音");
		dots.innerHTML = "";
		for (var i = 0; i < n; i++) {
			var it = el("i");
			if (i < fStep) it.className = "ok";
			if (i === fStep) it.classList.add("cur");
			it.title = d.chord ? d.chords[i][3] : sci(d.seq[i][0]) + " · " + d.seq[i][1] + " 指";
			it.textContent = "";
			dots.appendChild(it);
		}
		fKB.clear();
		if (fStep >= n) return;
		if (d.chord) {
			var c = d.chords[fStep];
			c.slice(0, 3).forEach(function(m){ fKB.cls(m, "hint"); });
			qEl.innerHTML += "<br>" + c[3] + " · " + c.slice(0,3).map(function(m){ return sci(m); }).join(" ") + " · 指法 1–3–5";
			fGot = [];
		} else {
			var s = d.seq[fStep];
			fKB.cls(s[0], "hint");
			qEl.innerHTML += "<br><b style='font-size:22px'>" + s[1] + " 指</b> · " + sci(s[0]) + "（" + solfMovable(s[0], 60) + "）";
			if (d.marks && d.marks[fStep]) qEl.innerHTML += "<br><em style='color:#d9a441'>" + d.marks[fStep] + "</em>";
		}
	}
	function fTap(m){
		var d = FINGERS[fIdx];
		var n = d.chord ? d.chords.length : d.seq.length;
		if (fStep >= n) { fKB.cls(m,"lit"); tone(m, fStac ? 0.18 : 0.5, 0.2); schedule(function(){ fKB.cls(m,""); }, 260); return; }
		if (d.chord) {
			var c = d.chords[fStep].slice(0,3);
			if (c.indexOf(m) < 0) { fErrs++; fKB.cls(m,"bad"); buzz(); say.className="say bad"; say.innerHTML="这个和弦里没有 " + sci(m); schedule(function(){ fKB.cls(m,""); },420); return; }
			if (fGot.indexOf(m) >= 0) return;
			fGot.push(m); fKB.cls(m,"ok"); tone(m, fStac ? 0.22 : 0.9, 0.18);
			if (fGot.length === 3) {
				fStep++; ding();
				say.className = "say good"; say.innerHTML = d.chords[Math.min(fStep, n) - 1][3] + " 按齐了";
				schedule(function(){ paintF(); if (fStep >= n) fFin(); }, 620);
			}
			return;
		}
		var s = d.seq[fStep];
		if (m === s[0]) {
			fKB.cls(m,"ok"); tone(m, fStac ? 0.18 : 0.6, 0.2);
			fStep++;
			if (fStep >= n) { paintF(); fFin(); return; }
			say.className = "say good"; say.innerHTML = "对了 · 下一个 <b>" + d.seq[fStep][1] + " 指</b>";
			paintF();
		} else {
			fErrs++; fKB.cls(m,"bad"); buzz();
			say.className = "say bad";
			say.innerHTML = "这里要 <b>" + sci(s[0]) + "</b> 用 <b>" + s[1] + " 指</b>";
			schedule(function(){ fKB.cls(m,""); }, 420);
		}
	}
	function fFin(){
		var d = FINGERS[fIdx], n = d.chord ? d.chords.length : d.seq.length;
		var pct = Math.round(n / (n + fErrs) * 100);
		mark(d.id, pct);
		var r = prog[d.id];
		stat.innerHTML = "练过 <b>" + r.n + "</b> 回 · 最佳 <b>" + r.best + "%</b>";
		qEl.innerHTML = "<b>" + d.n + "</b> 走完 · 错 " + fErrs + " 次 · <b>" + pct + "%</b>";
		say.className = pct >= 80 ? "say good" : "say bad";
		say.innerHTML = pct >= 80 ? "手位稳了 · 慢一点再来一遍，穿指跨指别塌手腕" : "错的那几下慢练：先把手指摆好，再落键";
		ding();
		var row = el("div","row"), again = el("button","act","再 来 一 遍");
		again.onclick = function(){ row.remove(); openF(); };
		var next = el("button","act g2","下 一 条");
		next.onclick = function(){ row.remove(); fIdx = (fIdx + 1) % FINGERS.length; openF(); };
		row.appendChild(again); row.appendChild(next);
		box.appendChild(row); again.focus();
	}
	openF();
}
function fingerKey(k){
	if (curTab !== "finger" || paused || !fKB || !fUI) return;
	var m = FKEYS[String(k).toLowerCase()];
	if (m == null) return;
	fKB.cls(m, "down");
	setTimeout(function(){ if (fKB) fKB.cls(m, ""); }, 110);
	fUI.tap(m);
}

/* ---------- 页签与启动 ---------- */
var PANES = { key:paneKey, meter:paneMeter, beat:paneBeat, finger:paneFinger };
var built = {}, curTab = "key";
function showTab(k){
	if (!PANES[k]) k = "key";
	curTab = k;
	stopAll();
	var bs = $("tabs").children;
	for (var i = 0; i < bs.length; i++) bs[i].classList.toggle("on", bs[i].dataset.k === k);
	for (var j in PANES) $("p-" + j).classList.toggle("on", j === k);
	if (!built[k]) { built[k] = true; PANES[k](); }
	$("main").scrollTop = 0;
	hud();
}
Array.prototype.forEach.call($("tabs").children, function(b){
	b.onclick = function(){ showTab(b.dataset.k); };
});
document.addEventListener("keydown", function(e){
	if (e.key === "Escape") { goHome(); return; }
	if ((e.key === "p" || e.key === "P") && !e.repeat) { e.preventDefault(); paused ? resumeGame() : pauseGame(); return; }
	if (paused) return;
	if (curTab === "beat" && (e.key === " " || e.key === "Enter") && !e.repeat) {
		var t = e.target;
		if (t && (t.tagName === "BUTTON" || t.tagName === "INPUT" || t.tagName === "A")) return;
		e.preventDefault(); beatTap();
	}
	if (curTab === "finger" && !e.repeat) fingerKey(e.key);
});
LESSON.key = ["key-name","key-scale","key-sign","key-solf","key-concept","key-ear"];
LESSON.meter = ["meter-read","meter-accent","meter-dot","meter-tie","meter-ana","meter-tempo"];
LESSON.beat = PATTERNS.filter(function(p){ return p.id !== "b-tri"; }).map(function(p){ return p.id; });
LESSON.finger = FINGERS.map(function(d){ return d.id; });
var want = new URLSearchParams(location.search).get("k");
showTab(want || "key");
hud();
</script>
