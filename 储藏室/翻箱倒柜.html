<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>翻箱倒柜 · 储藏室</title>
<style>
:root{
	--paper:#efe6d4; --ink:#2c2318; --wood:#b57a42; --wood2:#8a5a2e; --gold:#d9a441; --red:#c93b2e;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
	background:radial-gradient(120% 90% at 50% 0%,#3a3126 0%,#241e14 55%,#171208 100%);
	color:var(--paper);font-family:"Kaiti SC",KaiTi,STKaiti,"Noto Serif SC",serif;
	overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none;
}
#stage{position:fixed;inset:0;display:flex;flex-direction:column;max-width:640px;margin:0 auto;padding:max(10px,env(safe-area-inset-top)) 14px 12px}
header{display:flex;align-items:baseline;gap:14px;padding:2px 4px 8px;flex:none}
header h1{font-size:17px;letter-spacing:.35em;color:var(--gold);font-weight:600}
#hud{display:flex;gap:14px;margin-left:auto;font-size:14px;color:#d8c9a8;white-space:nowrap}
#hud b{color:#fff;font-size:17px;font-weight:600;font-family:Georgia,"Microsoft YaHei",serif}
#hud .cbo{color:#9c8a68}#hud .cbo b{color:var(--gold)}
#hud .cbo.hot b{animation:blink .5s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
#memo{flex:none;height:36px;display:flex;align-items:center;justify-content:center;gap:8px;
	font-size:14px;color:#cdb98e;letter-spacing:.08em;overflow:hidden}
#memo b{color:#f0e2c0;font-weight:600}
#memo.pop{animation:mpop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes mpop{0%{transform:translateY(9px);opacity:0}100%{transform:none;opacity:1}}
#board{flex:1;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:minmax(64px,1fr);
	gap:9px;padding:2px 0 14px;max-width:520px;width:100%;margin:0 auto}
.card{position:relative;border:none;background:none;padding:0;cursor:default;perspective:640px;
	-webkit-tap-highlight-color:transparent;animation:deal .5s backwards cubic-bezier(.25,1.2,.4,1)}
@keyframes deal{from{transform:translateY(30px) rotate(4deg);opacity:0}}
.card .in{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .38s cubic-bezier(.4,0,.25,1)}
.card.open .in{transform:rotateY(180deg)}
.bk,.fa{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:10px;overflow:hidden}
.bk{
	background:
		radial-gradient(80% 60% at 50% 12%,rgba(255,220,150,.16),transparent 70%),
		repeating-linear-gradient(0deg,#8a5a2e 0 21%,#7a4c22 21% 24%),
		linear-gradient(160deg,#9a6a38 0%,#6a431f 100%);
	box-shadow:0 5px 0 #4a2f14,0 9px 16px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.22);
}
.bk::before{content:"";position:absolute;inset:16% 12%;border:2px solid rgba(58,36,16,.5);border-radius:6px;
	background:repeating-linear-gradient(90deg,transparent 0 10px,rgba(58,36,16,.28) 10px 12px)}
.bk::after{content:"";position:absolute;left:50%;top:50%;width:15%;height:15%;transform:translate(-50%,-50%);
	border-radius:3px;background:linear-gradient(#e8c46a,#a87f2e);box-shadow:0 1px 2px rgba(0,0,0,.5)}
.fa{
	transform:rotateY(180deg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
	background:linear-gradient(172deg,#f5eedd 0%,#eadfc4 100%);
	box-shadow:0 4px 0 #b7a578,0 8px 14px rgba(0,0,0,.4),inset 0 0 26px rgba(168,132,80,.14);
	color:#5a4326;padding:6px 4px;
}
.fa svg{width:34%;max-width:34px;max-height:34px;stroke:#5a4326;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.fa span{font-size:clamp(10px,2.6vw,12.5px);letter-spacing:.12em;line-height:1.25;text-align:center}
.card.ok{cursor:default}
.card.ok .fa{box-shadow:0 2px 0 #b7a578,0 5px 9px rgba(0,0,0,.3),inset 0 0 0 2px var(--gold),inset 0 0 26px rgba(216,164,65,.18)}
.card.ok{animation:settle .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes settle{0%{transform:scale(1.12)}100%{transform:scale(1)}}
.card.cur{outline:2px solid var(--gold);outline-offset:2px;border-radius:12px}
.card:not(.ok):not(.lock){cursor:pointer}
.card.shk{animation:shk .34s}
@keyframes shk{0%,100%{transform:none}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
#foot{flex:none;text-align:center;font-size:12px;color:#b3a382;letter-spacing:.24em;padding:3px 0 4px}
/* 开场/结算面板 */
#panel{position:fixed;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;
	background:rgba(16,12,6,.72);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
#panel.hide{display:none}
#panel .cardp{width:min(88vw,380px);border-radius:14px;padding:26px 24px 20px;text-align:center;
	background:linear-gradient(170deg,#3a3126,#241e14);box-shadow:0 22px 60px rgba(0,0,0,.6),inset 0 0 0 1px rgba(217,164,65,.28);
	animation:pin .45s cubic-bezier(.2,1.3,.36,1)}
@keyframes pin{from{transform:translateY(26px) scale(.94);opacity:0}}
#panel h2{font-size:22px;letter-spacing:.42em;color:var(--gold);font-weight:600;text-indent:.42em}
#panel .sub{font-size:12px;letter-spacing:.34em;color:#9c8a68;margin:8px 0 12px}
#panel p{font-size:14px;line-height:1.9;color:#d8c9a8;text-align:justify;margin-bottom:14px}
#panel p b{color:#f0e2c0}
#panel .stat{display:flex;justify-content:center;gap:26px;margin:2px 0 14px;font-size:13px;color:#9c8a68}
#panel .stat b{display:block;font-size:24px;color:#fff;font-family:Georgia,serif}
#panel .grade{font-size:64px;line-height:1;color:var(--gold);font-family:Georgia,serif;font-weight:700;
	text-shadow:0 0 22px rgba(217,164,65,.55),0 3px 8px rgba(0,0,0,.5);animation:gpop .55s cubic-bezier(.2,1.6,.4,1) .12s backwards}
@keyframes gpop{from{transform:scale(2.1);opacity:0}}
#panel .gname{font-size:13px;letter-spacing:.4em;color:#cdb98e;margin:6px 0 12px}
#panel .rows{font-size:13.5px;color:#b8a67e;line-height:2;margin-bottom:12px;text-align:center}
#panel .rows b{color:#f0e2c0;font-family:Georgia,serif}
button.go{font-family:inherit;font-size:17px;letter-spacing:.5em;text-indent:.5em;color:#2c2318;
	background:linear-gradient(#e8c468,#caa032);border:none;border-radius:10px;padding:12px 30px;cursor:pointer;
	box-shadow:0 5px 0 #8a6a1e,0 9px 18px rgba(0,0,0,.45);transition:transform .12s,box-shadow .12s}
button.go:active{transform:translateY(3px);box-shadow:0 2px 0 #8a6a1e}
.back{display:inline-block;margin-top:13px;font-size:13px;color:#b3a382;text-decoration:none;letter-spacing:.2em}
.back:hover{color:#cdb98e}
</style>
</head>
<body>
<div id="stage">
	<header><h1>翻箱倒柜</h1>
		<div id="hud">
			<span>分 <b id="t-score">0</b></span>
			<span class="cbo" id="t-cbow">连击 <b id="t-combo">0</b></span>
			<span>步 <b id="t-tries">0</b></span>
			<span>时 <b id="t-time">0:00</b></span>
		</div>
	</header>
	<div id="memo"><span id="memo-t">地窖里的木箱，一色的黄铜搭扣</span></div>
	<div id="board"></div>
	<div id="foot">方 向 键 · 回 车 ｜ 触 屏 直 点</div>
</div>
<div id="panel"><div class="cardp" id="pcard"></div></div>
<script>
"use strict";
var $ = function(id){ return document.getElementById(id); };
var KEY = "mm_best";
var ITEMS = [
	{ n:"地铺床垫", m:"赊账十五块买的，九成新", i:'<rect x="3" y="10.5" width="18" height="7" rx="2"/><path d="M7.5 10.5v7M16.5 10.5v7"/><rect x="4" y="6.5" width="7" height="3" rx="1.5"/>' },
	{ n:"留声机", m:"桂花牌八音盒，上弦摇三圈", i:'<path d="M4.5 20.5h10c0-2.6-2.4-4-5-4s-5 1.4-5 4z"/><path d="M9.5 16.5v-4"/><path d="M9.5 12.5c0-4 3-7 6.8-8.2l4-1.2c.7 2.7-.4 5.6-3.1 7.2l-6.2 3.2"/>' },
	{ n:"小夜灯", m:"三档色温，换着睡", i:'<path d="M7 3.5h8l-1.8 6H8.8z"/><path d="M11 9.5v8"/><path d="M8.5 20.5h5"/><path d="M4.5 6.5c-1 1.6-1 3.4 0 5M19.5 6.5c1 1.6 1 3.4 0 5"/>' },
	{ n:"查账本", m:"连造它的我都骗不过", i:'<rect x="5" y="3.5" width="14" height="17" rx="2"/><path d="M9 8.5h6M9 12h4.5"/><path d="M9 16.5l1.8 1.8 3.2-3.6"/>' },
	{ n:"绿萝", m:"第一盆绿植，主打死不了", i:'<path d="M12 21c0-7 1.2-12.5 4.5-16.5"/><path d="M16.5 4.5c-3 .2-5.1 2-5.7 4.8 2.8.5 4.9-.9 5.7-4.8z"/><path d="M13.6 10.2c-2.8.2-4.8 2-5.4 4.8 2.8.5 4.9-1 5.4-4.8z"/>' },
	{ n:"番茄炒蛋", m:"国民下饭菜 No.1", i:'<circle cx="12" cy="14.5" r="6"/><path d="M12 8.5c-1-1.6-2.8-2.2-4.6-1.8M12 8.5c1-1.6 2.8-2.2 4.6-1.8"/><path d="M12 8.5v3.5"/>' },
	{ n:"布谷钟", m:"点到就报真时刻", i:'<path d="M6.5 8.5L12 3.5l5.5 5"/><rect x="7" y="8.5" width="10" height="12" rx="2"/><path d="M12 13v3l2 1.2"/><path d="M12 18.6v2"/>' },
	{ n:"星空毯", m:"盖着做的梦都有银河背景", i:'<rect x="4" y="8" width="16" height="10" rx="2.4"/><path d="M8.2 11l.8 1.7 1.8.2-1.3 1.2.4 1.8-1.7-.9-1.7.9.4-1.8L5.6 13l1.8-.2z"/><circle cx="14.8" cy="11" r=".7"/><circle cx="16.6" cy="14.6" r=".7"/><circle cx="14.2" cy="15.4" r=".5"/>' }
];
var GRADES = [ [4300,"S","管家级"], [3300,"A","老住户"], [2400,"B","熟门熟路"], [1100,"C","刚搬来"] ];
var deck = [], st = [], first = -1, flipLock = false, playing = false;
var score = 0, combo = 0, bestCombo = 0, tries = 0, matched = 0, miss = 0, t0 = 0, tickT = null, curIdx = 0;
var best = 0;
try { best = parseInt(localStorage.getItem(KEY), 10) || 0; } catch (e) {}
/* 小合成器 */
var AC = null;
function ac(){
	if (AC) return AC;
	var C = window.AudioContext || window.webkitAudioContext;
	if (!C) return null;
	AC = new C();
	return AC;
}
function tone(f0, f1, dur, vol, type, at){
	var c = ac(); if (!c) return;
	try {
		if (c.state === "suspended") c.resume();
		var t = c.currentTime + (at || 0);
		var o = c.createOscillator(), g = c.createGain();
		o.type = type || "triangle";
		o.frequency.setValueAtTime(f0, t);
		if (f1 && isFinite(f1) && f1 !== f0) o.frequency.linearRampToValueAtTime(f1, t + dur * .8);
		g.gain.setValueAtTime(vol, t);
		g.gain.linearRampToValueAtTime(0.0001, t + dur);
		o.connect(g); g.connect(c.destination);
		o.start(t); o.stop(t + dur + .05);
	} catch (e) {}
}
var PENTA = [523, 587, 659, 784, 880, 1047, 1175, 1319];
function sFlip(){ tone(190, 130, .07, .05, "sine"); }
function sMatch(k){ tone(PENTA[Math.min(k, 7)], 0, .16, .08); tone(PENTA[Math.min(k, 7)] * 1.5, 0, .22, .05, "triangle", .07); }
function sMiss(){ tone(150, 105, .16, .06, "sawtooth"); }
function sWin(){ [523, 659, 784, 1047].forEach(function(f, i){ tone(f, 0, .3, .07, "triangle", i * .11); }); }
function sEnd(){ tone(392, 262, .25, .06, "sine"); }
function fmt(ms){
	var s = Math.max(0, Math.round(ms / 1000));
	return Math.floor(s / 60) + ":" + ("0" + (s % 60)).slice(-2);
}
function hud(){
	$("t-score").textContent = score;
	$("t-combo").textContent = combo;
	$("t-tries").textContent = tries;
	var cw = $("t-cbow");
	cw.classList.toggle("hot", combo >= 2);
}
function buildBoard(){
	var b = $("board");
	b.innerHTML = "";
	deck = [];
	for (var i = 0; i < ITEMS.length; i++){ deck.push(i, i); }
	for (var j = deck.length - 1; j > 0; j--){
		var r = Math.floor(Math.random() * (j + 1)), tt = deck[j]; deck[j] = deck[r]; deck[r] = tt;
	}
	st = deck.map(function(){ return 0; });
	first = -1; flipLock = false; matched = 0; miss = 0; combo = 0; bestCombo = 0; tries = 0; score = 0; curIdx = 0;
	deck.forEach(function(id, i2){
		var it = ITEMS[id];
		var c = document.createElement("button");
		c.className = "card"; c.dataset.i = i2;
		c.style.animationDelay = (i2 * 42) + "ms";
		c.innerHTML = '<div class="in"><div class="bk"></div><div class="fa"><svg viewBox="0 0 24 24">' + it.i + '</svg><span>' + it.n + '</span></div></div>';
		b.appendChild(c);
	});
	paintCur();
	hud();
	$("memo-t").innerHTML = "地窖里的木箱，一色的黄铜搭扣";
}
function paintCur(){
	var cards = $("board").children;
	for (var i = 0; i < cards.length; i++) cards[i].classList.toggle("cur", playing && i === curIdx);
}
function flip(i){
	if (!playing || flipLock || st[i] !== 0) return;
	var cards = $("board").children, c = cards[i];
	st[i] = 1; c.classList.add("open"); sFlip();
	if (first < 0) { first = i; return; }
	var a = first; first = -1;
	tries++;
	flipLock = true;
	if (deck[a] === deck[i]) {
		matched++; combo++; bestCombo = Math.max(bestCombo, combo);
		var gain = 260 + Math.min(combo - 1, 5) * 70;
		score += gain;
		st[a] = 2; st[i] = 2;
		var it = ITEMS[deck[i]];
		var mt = $("memo");
		$("memo-t").innerHTML = "<b>" + it.n + "</b> · " + it.m;
		mt.classList.remove("pop"); void mt.offsetWidth; mt.classList.add("pop");
		sMatch(matched - 1);
		cards[a].classList.add("ok"); c.classList.add("ok");
		flipLock = false;
		hud();
		if (matched === 8) finish();
	} else {
		combo = 0; miss++; score = Math.max(0, score - 40);
		hud(); sMiss();
		c.classList.add("shk"); cards[a].classList.add("shk");
		var ia = a, ii = i;
		setTimeout(function(){
			var cs = $("board").children;
			st[ia] = 0; st[ii] = 0;
			cs[ia].classList.remove("open", "shk"); cs[ii].classList.remove("open", "shk");
			flipLock = false;
		}, 760);
	}
}
function finish(){
	playing = false;
	var el = (Date.now() - t0) / 1000;
	var tBonus = Math.max(0, Math.round((180 - el) * 8));
	var final = score + tBonus;
	var g = GRADES[GRADES.length - 1];
	for (var k = 0; k < GRADES.length; k++) { if (final >= GRADES[k][0]) { g = GRADES[k]; break; } }
	var isNew = final > best;
	if (isNew) { best = final; try { localStorage.setItem(KEY, String(best)); } catch (e) {} }
	sWin();
	$("pcard").innerHTML =
		'<div class="grade">' + g[1] + '</div><div class="gname">' + g[2] + " · 旧物八件，各归各位</div>" +
		'<div class="rows">配对 <b>' + score + "</b>（失误 " + miss + "）<br>手快 <b>+" + tBonus + "</b> · 合计 <b>" + final + "</b>" +
		(isNew ? '<br><span style="color:#d9a441">此间新纪录</span>' : " · 此间最好 " + best) + "</div>" +
		'<button class="go" id="btn-ag">再 翻 一 局</button>' +
		'<div><a class="back" href="../我的家.html">回小家</a></div>';
	$("panel").classList.remove("hide");
	$("btn-ag").onclick = start;
}
function start(){
	$("panel").classList.add("hide");
	buildBoard();
	playing = true;
	t0 = Date.now();
	if (tickT) clearInterval(tickT);
	tickT = setInterval(function(){
		if (!playing) return;
		var el = Date.now() - t0;
		$("t-time").textContent = fmt(el);
		if (el >= 180000) finish();
	}, 400);
}
$("board").addEventListener("pointerdown", function(e){
	var t = e.target.closest ? e.target.closest(".card") : null;
	if (t && !t.classList.contains("lock")) { e.preventDefault(); flip(+t.dataset.i); }
});
document.addEventListener("keydown", function(e){
	if (e.key === "Escape"){ try { parent.postMessage("zhouse-back", "*"); } catch (err) {} return; }
	if ($("panel") && !$("panel").classList.contains("hide")) return;
	if (!playing) return;
	var k = e.key;
	if (k === "ArrowLeft" || k === "ArrowUp" || k === "ArrowRight" || k === "ArrowDown" || k === "Enter" || k === " ") e.preventDefault();
	else return;
	var step = (k === "ArrowLeft" || k === "ArrowUp") ? -1 : (k === "ArrowRight" || k === "ArrowDown") ? 1 : 0;
	if (step) { curIdx = (curIdx + step + 16) % 16; paintCur(); }
	else flip(curIdx);
});
(function(){
	$("pcard").innerHTML = "<h2>翻箱倒柜</h2>" +
		'<div class="sub">储 藏 室 · 旧 物 团 圆</div>' +
		"<p>地下室堆着十六只木箱，八件旧家当各占一对。翻开两只，凑成一对就搬上台面——<b>连着配对</b>有彩头，翻错要扣分。三分钟内翻完，手快也有份。<br>键盘 <b>方向键 · 回车</b>，手机直接点箱子。</p>" +
		(best ? '<div class="stat"><span>此间最好</span><b>' + best + "</b></div>" : "") +
		'<button class="go" id="btn-go">开 箱</button>' +
		'<div><a class="back" href="../我的家.html">回小家</a></div>';
	$("btn-go").onclick = start;
})();
window.addEventListener("message", function(e){ if (e.data === "zhouse-replay") start(); });
/* 自动玩家接口：校准评级用 */
window.MM = {
	deck: function(){ return deck.slice(); },
	states: function(){ return st.slice(); },
	on: function(){ return playing; },
	locked: function(){ return flipLock; },
	flip: flip,
	begin: start,
	info: function(){ return { score: score, tries: tries, matched: matched, miss: miss, combo: bestCombo }; }
};
</script>
</body>
</html>
