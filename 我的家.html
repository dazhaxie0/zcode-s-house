<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小Z 的小家 · 豪华版</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
--paper: #faf3e6; --paper-2: #f4ead8; --paper-3: #fff8ec;
--ink: #4a3a28; --ink-2: #8a7458; --ink-3: #b09a78;
--wood: #6b4f2e; --wood-2: #8a6a3e;
--gold: #d4880f; --gold-2: #f0c46a; --gold-3: #fdf0d5;
--line: #eadfce; --danger: #c0564a; --ok: #4a8a5c;
--r-lg: 20px; --r-md: 14px; --r-sm: 10px;
--shadow-lg: 0 24px 60px rgba(0,0,0,.38);
--shadow-md: 0 10px 26px rgba(74,58,40,.18);
--sky-a: #2b3a55; --sky-b: #4a5a7a;
}
body[data-theme="theme-night"] {
--paper: #212a3d; --paper-2: #1a2233; --paper-3: #2a3450;
--ink: #e9e6da; --ink-2: #aab3c8; --ink-3: #7d879e;
--wood: #3b445c; --wood-2: #4d5878;
--gold: #e8b04b; --gold-2: #f5d68a; --line: #39415a;
}
body[data-theme="theme-matcha"] {
--paper: #f2f5e8; --paper-2: #e7eeda; --paper-3: #fafbf2;
--ink: #3d4a2e; --ink-2: #71805c; --ink-3: #9aa884;
--wood: #5a7048; --wood-2: #71875e; --gold: #b08a1e; --gold-2: #dcc26a; --line: #dbe5c8;
}
body[data-theme="theme-rose"] {
--paper: #fbf0f0; --paper-2: #f6e3e3; --paper-3: #fdf7f5;
--ink: #5c3a3a; --ink-2: #a07878; --ink-3: #c09a9a;
--wood: #8a5560; --wood-2: #a4707b; --gold: #c47a3a; --gold-2: #eebd8a; --line: #f0dcdc;
}
html { scroll-behavior: smooth; }
body {
font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
color: var(--ink); min-height: 100vh; overflow-x: hidden;
background: linear-gradient(180deg, var(--sky-a) 0%, var(--sky-b) 100%);
}
body[data-phase="dawn"] { --sky-a: #6d5b7a; --sky-b: #e8a87c; }
body[data-phase="day"] { --sky-a: #7fb2d9; --sky-b: #cfe6f2; }
body[data-phase="dusk"] { --sky-a: #4a3a5c; --sky-b: #d97a5a; }
body[data-phase="night"] { --sky-a: #131c30; --sky-b: #2c3a55; }
body[data-screen="title"] { --sky-a: #0d1526; --sky-b: #1e2c48; }
canvas#sky-canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
canvas#fx-canvas { position: fixed; inset: 0; z-index: 150; pointer-events: none; }
.screen { position: fixed; inset: 0; overflow-y: auto; overflow-x: hidden; display: none; z-index: 5; }
.screen.on { display: block; }
svg.ic {
width: 1em; height: 1em; display: inline-block; vertical-align: -0.125em;
fill: none; stroke: currentColor; stroke-width: 2;
stroke-linecap: round; stroke-linejoin: round; flex: none;
}
button { font-family: inherit; }
.btn {
border: none; cursor: pointer; border-radius: 10px;
background: linear-gradient(180deg, var(--gold-2), var(--gold));
color: #3a2c12; font-weight: bold; font-size: 13.5px;
padding: 9px 22px; letter-spacing: 3px;
box-shadow: 0 4px 14px rgba(212,136,15,.35), inset 0 1px 0 rgba(255,255,255,.5);
transition: transform .12s, filter .12s;
}
.btn:hover { transform: translateY(-2px); filter: brightness(1.06); }
.btn:active { transform: translateY(0); }
.btn.ghost { background: var(--paper-3); color: var(--ink-2); box-shadow: inset 0 0 0 2px var(--line); }
.btn.ghost:hover { color: var(--ink); }
code {
background: color-mix(in srgb, var(--line) 60%, transparent);
border-radius: 5px; padding: 1px 6px; font-size: 11.5px;
font-family: Consolas, "Courier New", monospace;
}
#screen-boot {
position: fixed; inset: 0; z-index: 80; display: flex;
align-items: center; justify-content: center; flex-direction: column;
background: #0a0e18; color: #cfd6e4; text-align: center;
}
.boot-logo { opacity: 0; transition: opacity .8s; letter-spacing: .35em; }
.boot-logo.l1 { font-size: clamp(14px, 3vw, 20px); font-weight: bold; }
.boot-logo.show { opacity: 1; }
.boot-bar-wrap {
width: min(46vw, 380px); height: 5px; border-radius: 4px;
background: #1c2436; margin-top: 48px; overflow: hidden; display: none;
}
.boot-bar-wrap.show { display: block; }
.boot-bar {
height: 100%; width: 0%; border-radius: 4px;
background: linear-gradient(90deg, #d4880f, #f0c46a);
box-shadow: 0 0 12px rgba(240,196,106,.7);
}
.boot-enter {
margin-top: 42px; opacity: 0; transition: opacity .5s; pointer-events: none;
font-size: 14px; letter-spacing: .6em; color: #f0c46a; animation: breathe 1.8s ease-in-out infinite;
}
.boot-enter.show { opacity: 1; pointer-events: auto; }
@keyframes breathe { 50% { opacity: .35; } }
#screen-boot.clickable { cursor: pointer; }
#screen-title {
display: none; z-index: 10; text-align: center;
padding: 7vh 16px 40px; color: #f2ecd9;
}
#screen-title.on { display: flex; flex-direction: column; align-items: center; }
.title-stage { position: relative; width: min(92vw, 520px); }
.title-rays {
position: absolute; left: 50%; top: 40%; width: 170%; aspect-ratio: 1;
transform: translate(-50%, -50%);
background: conic-gradient(from 10deg,
transparent 0deg, rgba(240,196,106,.09) 14deg, transparent 30deg,
transparent 90deg, rgba(240,196,106,.07) 104deg, transparent 120deg,
transparent 200deg, rgba(240,196,106,.09) 214deg, transparent 230deg,
transparent 300deg, rgba(240,196,106,.07) 314deg, transparent 330deg);
border-radius: 50%; filter: blur(3px);
animation: spinrays 70s linear infinite; pointer-events: none;
}
@keyframes spinrays { to { transform: translate(-50%,-50%) rotate(360deg); } }
.mark {
width: clamp(88px, 18vw, 128px); height: auto; color: var(--gold-2);
filter: drop-shadow(0 8px 28px rgba(240,196,106,.35));
animation: housebob 5.5s ease-in-out infinite; position: relative;
}
@keyframes housebob { 50% { transform: translateY(-8px); } }
.title-logo {
font-size: clamp(28px, 6vw, 46px); font-weight: 900; letter-spacing: .18em;
margin-top: 18px; font-family: Georgia, "Microsoft YaHei", serif;
background: linear-gradient(180deg, #fdf3d7, #e8b04b 70%, #b07714);
-webkit-background-clip: text; background-clip: text; color: transparent;
}
.title-sub {
margin-top: 9px; font-size: clamp(10px, 2.2vw, 12.5px); letter-spacing: .85em;
color: #b8a97f; text-transform: uppercase;
}
.title-motto { margin-top: 15px; font-size: 12.5px; color: #8d97ad; letter-spacing: .3em; }
.title-menu { margin-top: 5vh; display: flex; flex-direction: column; gap: 11px; width: min(74vw, 280px); }
.tmenu-item {
display: flex; align-items: center; gap: 14px;
background: rgba(20,28,44,.55); color: #e9e2cd;
border: 1px solid rgba(240,196,106,.28); border-radius: 12px;
padding: 12px 22px; font-size: 14.5px; letter-spacing: .5em; cursor: pointer;
transition: all .16s; backdrop-filter: blur(4px);
}
.tmenu-item .ic { font-size: 19px; color: var(--gold-2); }
.tmenu-item:hover, .tmenu-item:focus-visible {
background: rgba(212,136,15,.22); border-color: var(--gold-2);
transform: translateX(6px); box-shadow: 0 0 22px rgba(240,196,106,.18); outline: none;
}
.title-save { margin-top: 26px; font-size: 12px; color: #6d7890; display: flex; gap: 18px; align-items: center; }
.title-save .ic { color: #8d97ad; }
.title-foot {
position: absolute; bottom: 14px; left: 0; right: 0;
display: flex; justify-content: space-between; padding: 0 18px;
font-size: 11px; color: rgba(255,255,255,.4); letter-spacing: .1em;
}
#screen-house { padding: 0 0 60px; }
.cloud { cursor: pointer;
position: fixed; width: 96px; height: 26px; border-radius: 20px;
background: rgba(255,255,255,.3); z-index: 1; pointer-events: none;
animation: drift linear infinite;
}
.cloud::before, .cloud::after {
content: ""; position: absolute; background: inherit; border-radius: 50%;
}
.cloud::before { width: 42px; height: 42px; top: -20px; left: 16px; }
.cloud::after { width: 30px; height: 30px; top: -12px; right: 14px; }
body[data-phase="night"] .cloud { opacity: .3; }
.cloud.c1 { top: 7%; animation-duration: 55s; }
.cloud.c2 { top: 17%; transform: scale(.68); animation-duration: 80s; animation-delay: -30s; }
.cloud.c3 { top: 4%; transform: scale(.82); animation-duration: 65s; animation-delay: -50s; }
@keyframes drift { from { left: -12%; } to { left: 110%; } }
.hud {
position: sticky; top: 0; z-index: 30;
display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
padding: 10px 14px;
background: color-mix(in srgb, var(--paper) 84%, transparent);
backdrop-filter: blur(8px); border-bottom: 2px solid var(--line);
}
.hud .pill {
display: inline-flex; align-items: center; gap: 8px;
background: var(--paper-3); border: 2px solid var(--line);
border-radius: 999px; padding: 7px 15px; font-size: 13.5px; color: var(--ink);
cursor: pointer; transition: border-color .15s, transform .15s; white-space: nowrap;
}
.hud .pill:hover { border-color: var(--gold); transform: translateY(-1px); }
.hud .pill .ic { color: var(--gold); font-size: 16px; }
.hud .pill b { color: var(--gold); font-size: 15px; }
.hud .spacer { flex: 1; }
.hud .ico-btn {
width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--line);
background: var(--paper-3); color: var(--ink-2); font-size: 17px; cursor: pointer;
display: inline-flex; align-items: center; justify-content: center;
transition: transform .15s, border-color .15s, color .15s; position: relative;
}
.hud .ico-btn .ic { font-size: 19px; }
.hud .ico-btn:hover { transform: translateY(-2px); border-color: var(--gold); color: var(--gold); }
.hud .ico-btn::after {
content: attr(data-tip); position: absolute; top: 112%; left: 50%;
transform: translateX(-50%) scale(.8); opacity: 0; pointer-events: none;
background: rgba(20,28,44,.92); color: #f2ecd9; font-size: 11px;
padding: 4px 10px; border-radius: 6px; white-space: nowrap;
transition: opacity .15s, transform .15s;
}
.hud .ico-btn:hover::after { opacity: 1; transform: translateX(-50%) scale(1); }
.hud .ico-btn.off { opacity: .45; }
.house-wrap { max-width: 760px; margin: 26px auto 0; padding: 0 16px; position: relative; z-index: 2; }
.greet { text-align: center; color: #fff; margin-bottom: 22px; text-shadow: 0 2px 8px rgba(0,0,0,.3); }
.greet h1 {
font-size: clamp(19px, 4.2vw, 26px); letter-spacing: .2em; font-weight: 900;
display: inline-flex; align-items: center; gap: 12px;
}
.greet h1 .ic { font-size: .95em; color: var(--gold-2); }
.greet p { margin-top: 8px; font-size: 12.5px; opacity: .8; letter-spacing: .25em; }
.facade {
background: linear-gradient(180deg, var(--paper) 0%, var(--paper-2) 100%);
border-radius: var(--r-lg); padding: 56px 26px 22px;
box-shadow: var(--shadow-lg); position: relative;
}
.roofline { position: absolute; left: 0; top: 0; width: 62px; cursor: grab; touch-action: none; will-change: transform;
color: var(--wood); filter: drop-shadow(0 6px 10px rgba(0,0,0,.25)); will-change: transform; z-index: 12; }
.chimney-smoke {
position: absolute; top: -10px; right: calc(50% - 128px);
width: 52px; height: 44px; cursor: pointer; z-index: 3;
}
.puff {
position: absolute; bottom: 2px; left: 50%; width: 14px; height: 14px;
border-radius: 50%; background: rgba(240,236,226,.55);
filter: blur(2px); opacity: 0; animation: puff 4s ease-out infinite;
}
.puff:nth-child(2) { animation-delay: 1.3s; }
.puff:nth-child(3) { animation-delay: 2.6s; }
@keyframes puff {
0% { opacity: 0; transform: translate(-50%, 0) scale(.5); }
20% { opacity: .8; }
100% { opacity: 0; transform: translate(-40%, -52px) scale(2); }
}
.win-row { display: flex; justify-content: center; gap: 26px; margin: -42px 0 12px; position: relative; z-index: 2; }
.win { cursor: pointer;
width: 32px; height: 38px; border-radius: 6px 6px 10px 10px;
background: linear-gradient(180deg, #7fb2d9, #a8cbe4);
border: 3px solid var(--wood-2); position: relative; overflow: hidden;
}
.win::before {
content: ""; position: absolute; inset: 0;
background: linear-gradient(135deg, transparent 42%, rgba(255,255,255,.5) 46%, transparent 52%);
}
body[data-phase="night"] .win {
background: radial-gradient(circle at 50% 60%, #ffd98a, #d9962e);
box-shadow: 0 0 18px rgba(255,200,100,.55);
}
body[data-phase="night"] .win.flicker { animation: winflick 7s steps(1) infinite; }
body[data-phase="night"] .win.off { background: #2c3550; box-shadow: none; }
.win.off { filter: brightness(.55) saturate(.4); }
@keyframes winflick { 88%, 92% { box-shadow: 0 0 4px rgba(255,200,100,.2); } }
.rooms { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; margin-top: 6px; }
.room {
position: relative; background: var(--paper-3); border-radius: var(--r-md);
border: 2px solid var(--line); padding: 16px 16px 13px; cursor: pointer;
transition: transform .18s, box-shadow .18s, border-color .18s;
display: flex; align-items: center; gap: 14px; overflow: hidden;
}
.room::before {
content: ""; position: absolute; top: 0; left: 0; right: 0; height: 4px;
background: linear-gradient(90deg, var(--gold-2), var(--gold)); opacity: 0; transition: opacity .18s;
}
.room:hover, .room:focus-visible { transform: translateY(-4px); box-shadow: var(--shadow-md); border-color: var(--gold-2); outline: none; }
.room:hover::before, .room:focus-visible::before { opacity: 1; }
.room .r-ic {
width: 52px; height: 52px; border-radius: 14px; flex: none;
background: color-mix(in srgb, var(--gold) 10%, var(--paper-2));
border: 2px solid color-mix(in srgb, var(--gold) 28%, transparent);
color: var(--wood); display: flex; align-items: center; justify-content: center;
font-size: 27px; transition: transform .2s;
}
body[data-theme="theme-night"] .room .r-ic { color: var(--gold-2); }
.room:hover .r-ic { transform: scale(1.08) rotate(-4deg); }
.room .r-tx { min-width: 0; }
.room h2 { font-size: 16px; color: var(--wood); letter-spacing: .2em; display: flex; align-items: baseline; gap: 8px; }
body[data-theme="theme-night"] .room h2 { color: var(--gold-2); }
.room .cnt { font-size: 11px; color: var(--ink-3); letter-spacing: .08em; }
.room .chev { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--ink-3); font-size: 17px; transition: transform .18s, color .18s; }
.room:hover .chev { color: var(--gold); transform: translateY(-50%) translateX(3px); }
.room .plate {
position: absolute; top: 9px; right: 30px; font-size: 9.5px; letter-spacing: .15em;
color: var(--ink-3); border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px;
}
.cellar { margin-top: 13px; }
footer.house-foot { text-align: center; color: rgba(255,255,255,.5); font-size: 11.5px; margin-top: 26px; letter-spacing: .35em; }
#cat {
position: absolute; bottom: 6px; z-index: 25; cursor: pointer;
color: #3a2c1c; width: 62px; height: 46px; user-select: none;
filter: drop-shadow(0 3px 4px rgba(0,0,0,.3)); display: none;
}
#cat.on { display: block; }
#cat .catsvg { width: 62px; height: 46px; display: block; }
#cat .catsvg * { transform-box: fill-box; transform-origin: center; }
#cat .catsvg #catTail { transform-origin: 0 100%; }
#cat .catsvg #catHead { transform-origin: 60% 80%; }
#wand,#ldot,#yarnb { position: absolute; z-index: 26; pointer-events: none; opacity: 0; }
#wand { width: 3px; height: 46px; background: #8a6a4a; border-radius: 3px; transform-origin: 50% 100%; animation: wob 1.1s infinite; }
#wand::before { content: ""; position: absolute; top: -13px; left: -8px; width: 19px; height: 19px; border-radius: 50%; background: #e88a9a; box-shadow: inset -3px -3px 0 #d76f85; }
@keyframes wob { 50% { rotate: 10deg; } }
#ldot { width: 10px; height: 10px; border-radius: 50%; background: #ff5f5f; box-shadow: 0 0 14px 4px rgba(255,95,95,.5); }
#yarnb { width: 20px; height: 20px; border-radius: 50%; background: #d97a5a; box-shadow: inset -4px -4px 0 #b85c3f; }
#yarnb.pop { transition: transform .4s, opacity .4s; transform: translateY(-34px) scale(.2) rotate(720deg) !important; opacity: 0 !important; }
#iris {
position: fixed; inset: 0; z-index: 60; background: #0b0f1a;
clip-path: circle(0% at 50% 50%); pointer-events: none; visibility: hidden;
}
#iris.go { visibility: visible; }
#room-overlay {
position: fixed; inset: 0; z-index: 40; display: none;
overflow-y: auto; background: linear-gradient(180deg, #0e1322, #1c2438);
}
#room-overlay.on { display: block; }
.room-inner { max-width: 780px; margin: 0 auto; padding: 22px 16px 60px; color: #e9e6da; }
.room-head { display: flex; align-items: center; gap: 15px; }
.room-head .r-ic {
width: 50px; height: 50px; border-radius: 14px; font-size: 27px; color: var(--gold-2);
background: rgba(240,196,106,.1); border: 2px solid rgba(240,196,106,.3);
display: flex; align-items: center; justify-content: center;
}
.room-head h2 { font-size: 21px; letter-spacing: .3em; }
.room-head .sub { font-size: 12px; color: #9aa3b8; margin-top: 4px; letter-spacing: .15em; }
.room-head .back {
margin-left: auto; background: rgba(255,255,255,.07); color: #e9e6da;
border: 1px solid rgba(240,196,106,.35); border-radius: 10px;
padding: 8px 16px; font-size: 12.5px; letter-spacing: .2em; cursor: pointer;
display: inline-flex; align-items: center; gap: 6px; transition: background .15s;
}
.room-head .back .ic { font-size: 14px; }
.room-head .back:hover { background: rgba(212,136,15,.25); }
.scene {
position: relative; height: 230px; margin-top: 18px; border-radius: var(--r-md);
overflow: hidden; border: 1px solid rgba(255,255,255,.1);
box-shadow: inset 0 0 60px rgba(0,0,0,.5);
}
.scene > svg.art { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.scene .hot { cursor: pointer; }
.scene .hot:hover { filter: brightness(1.18); }
.scene.living { background: linear-gradient(180deg, #4a3524, #2a1d12); }
.scene.bedroom { background: linear-gradient(180deg, #141a2e, #0c101f); }
.scene.study { background: linear-gradient(180deg, #33291c, #1e160e); }
.scene.kitchen { background: linear-gradient(180deg, #3d3126, #241c14); }
.scene.balcony { background: linear-gradient(180deg, #8fc3e8, #d9ecf5 74%); }
.scene.cellar { background: linear-gradient(180deg, #262626, #131313); }
.flick { animation: flick 2.6s steps(2) infinite; }
@keyframes flick { 50% { opacity: .55; } }
.spin { transform-origin: center; transform-box: fill-box; animation: spin 7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.steam { animation: steamup 3s ease-out infinite; }
.steam.s2 { animation-delay: 1.4s; }
@keyframes steamup {
0% { opacity: 0; transform: translateY(0); }
25% { opacity: .6; }
100% { opacity: 0; transform: translateY(-30px); }
}
.nlg { animation: nlg 4s ease-in-out infinite; }
@keyframes nlg { 50% { opacity: .4; } }
@keyframes zf { 0% { opacity: 0; transform: translateY(4px);} 30% { opacity: .7; } 100% { opacity: 0; transform: translateY(-16px);} }
.swing { transform-origin: top center; animation: swing 3.8s ease-in-out infinite; }
@keyframes swing { 50% { transform: rotate(7deg); } }
.inv-title { margin: 22px 0 10px; font-size: 11.5px; letter-spacing: .4em; color: #9aa3b8; display: flex; align-items: center; gap: 10px; }
.inv-title::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, rgba(240,196,106,.4), transparent); }
.inv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 10px; }
.inv-slot {
background: rgba(255,255,255,.05); border: 2px solid rgba(255,255,255,.1);
border-radius: var(--r-sm); padding: 13px 10px 11px; cursor: pointer; text-align: center;
transition: transform .15s, border-color .15s, background .15s; position: relative;
}
.inv-slot:hover { transform: translateY(-3px); border-color: var(--gold-2); background: rgba(212,136,15,.1); }
.inv-slot .ie {
width: 44px; height: 44px; margin: 0 auto; border-radius: 12px; font-size: 23px;
color: #e9e6da; background: rgba(255,255,255,.07);
display: flex; align-items: center; justify-content: center;
}
.inv-slot .in { font-size: 12.5px; margin-top: 8px; color: #e9e6da; letter-spacing: .05em; }
.inv-slot .rare { position: absolute; top: 7px; right: 8px; font-size: 9px; padding: 2px 6px; border-radius: 99px; letter-spacing: .1em; }
.r-tool { background: rgba(90,140,200,.18); color: #8fb8e8; border: 1px solid rgba(90,140,200,.4); }
.r-web { background: rgba(170,120,220,.18); color: #c9a9f0; border: 1px solid rgba(170,120,220,.4); }
.r-book { background: rgba(110,180,110,.18); color: #9ed49e; border: 1px solid rgba(110,180,110,.4); }
.r-food { background: rgba(230,150,80,.18); color: #eeb080; border: 1px solid rgba(230,150,80,.4); }
.r-plant { background: rgba(120,200,150,.18); color: #96e0b4; border: 1px solid rgba(120,200,150,.4); }
.r-furn { background: rgba(200,170,110,.18); color: #e4c890; border: 1px solid rgba(200,170,110,.4); }
.modal-mask {

.shop-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }

.shop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }

.cg-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(146px, 1fr)); gap: 10px; }

.cg-quote {

.cg-meta { font-size: 11px; color: var(--ink-3); margin-top: 9px; letter-spacing: .2em; }
.ledger-line { font-size: 13px; color: var(--ink); line-height: 2.05; display: flex; gap: 6px; align-items: baseline; }

.hint {

}
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 10px 2px; border-bottom: 1px dashed var(--line); font-size: 13.5px; }

.set-row input[type=range] { width: 140px; accent-color: var(--gold); }

}

}

.set-row select {

}
.danger-btn { background: none; border: 2px solid color-mix(in srgb, var(--danger) 60%, transparent); color: var(--danger); border-radius: 8px; padding: 6px 14px; font-size: 12px; cursor: pointer; }
#toasts { position: fixed; top: 16px; right: 16px; z-index: 160; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
.toast {
display: flex; gap: 12px; align-items: center; min-width: 200px; max-width: 300px;

border: 1px solid rgba(240,196,106,.45); border-radius: 12px;

}
.toast.out { animation: toastout .3s forwards; }
@keyframes toastin { from { transform: translateX(120%); opacity: 0; } }
@keyframes toastout { to { transform: translateX(130%); opacity: 0; } }
.toast .ic { font-size: 21px; color: var(--gold-2); flex: none; }
.toast .tt { font-size: 10.5px; letter-spacing: .3em; color: var(--gold-2); }
.toast .tm { font-size: 13px; margin-top: 2px; line-height: 1.5; }
.star-float { position: fixed; z-index: 155; pointer-events: none; display: flex; gap: 4px; align-items: center;

.star-float.neg { color: var(--danger); }

@keyframes starfloat { from { opacity: 0; transform: translate(-50%, 8px); } 22% { opacity: 1; } to { opacity: 0; transform: translate(-50%, -44px); } }
#plat-banner { position: fixed; left: 0; right: 0; top: 38%; z-index: 155; display: none; text-align: center;
padding: 22px 0; pointer-events: none;
background: linear-gradient(90deg, transparent, rgba(8,8,10,.88) 18%, rgba(8,8,10,.88) 82%, transparent);
border-top: 2px solid #c9a15f; border-bottom: 2px solid #c9a15f; }

@keyframes platfade { 0% { opacity: 0; } 10% { opacity: 1; } 82% { opacity: 1; } 100% { opacity: 0; } }
@keyframes plattrack { from { letter-spacing: .8em; } to { letter-spacing: .3em; } }
body.shake { animation: bodyshake .3s; }

/* ---------- 场景物件交互 ---------- */
.scene .hot { cursor: pointer; }
.scene .tv .scr, .scene .lamp .lampglow, .scene .sofa .cotton, .scene .sleeper { transition: .35s; }
.scene .tv.on .scr { fill: #0d1522; }
.scene .tv .ch, .scene .tv .sl { display: none; }
.scene .tv.on .sl { display: block; }
.scene .tv.on.k1 .c1, .scene .tv.on.k2 .c2, .scene .tv.on.k3 .c3 { display: block; }
.scene .tv.on .scrG { transform-box: fill-box; transform-origin: 50% 50%; animation: crton .32s ease-out; filter: drop-shadow(0 0 5px rgba(150,190,255,.5)); }
@keyframes crton { 0% { transform: scaleY(.04); filter: brightness(2.6); } 62% { transform: scaleY(1.07); } 100% { transform: scaleY(1); } }
.scene .tv .tw { animation: twk 1.9s ease-in-out infinite; }
.scene .tv .tw:nth-of-type(2n) { animation-delay: .7s; }
@keyframes twk { 50% { opacity: .2; } }
.scene .sofa { transform-box: fill-box; transform-origin: 50% 100%; }
.scene .sofa.wob { animation: swob .5s; }
@keyframes swob { 25% { transform: rotate(-2.6deg); } 55% { transform: rotate(1.9deg); } 80% { transform: rotate(-.9deg); } }
.scene .sofa .cotton { opacity: 0; transform-box: fill-box; transform-origin: 50% 100%; }
.scene .sofa.bulge .cotton { opacity: 1; animation: cpop .45s cubic-bezier(.2,1.6,.4,1); }
@keyframes cpop { from { transform: scale(.2); } }
.scene .lamp .lampglow { opacity: 0; }
.scene .lamp.lit .lampglow { opacity: 1; }
.scene .lamp.buzz .lampglow { animation: bz .1s infinite; }
@keyframes bz { 50% { opacity: .05; } }
.scene .curtain rect { transform-box: fill-box; transform: scaleX(.42); transition: transform .5s cubic-bezier(.55,0,.3,1); }
.scene .curtain rect:first-child { transform-origin: left center; }
.scene .curtain rect:last-child { transform-origin: right center; }
.scene .win.closed .curtain rect { transform: scaleX(2.55); }
.scene .sleeper { opacity: 0; transform-box: fill-box; }
.scene .sleeper path { transform-box: fill-box; transform-origin: 50% 50%; transition: .35s; }
.scene .sleeper circle { transform-box: fill-box; transition: .35s; }
.scene .bed.sleeping .sleeper { opacity: 1; }
.scene .bed.s1 .sleeper path { transform: scaleX(-1); }
.scene .bed.s1 .sleeper circle { transform: translateY(2.5px); }
.scene .meteor { opacity: 0; }
.met .meteor { animation: met 5s linear infinite; }
@keyframes met { 0%, 86% { opacity: 0; } 88% { opacity: 1; } 94% { opacity: 0; transform: translate(-44px, 26px); } 100% { opacity: 0; } }
.shelf-bk { padding: 14px 12px 0; background: linear-gradient(180deg,#3d2c1a,#2c1e12 26%,#251a0f); border-radius: 12px; border: 3px solid #52412a; box-shadow: inset 0 10px 20px rgba(0,0,0,.5), inset 0 -6px 14px rgba(0,0,0,.4); }
.shelf-bk::before { content: ""; display: block; height: 6px; margin: 0 -2px; border-radius: 3px; background: linear-gradient(180deg,#6a5436,#4a3a24); box-shadow: 0 2px 3px rgba(0,0,0,.4); }
.shelf-bk .rail { display: flex; align-items: flex-end; justify-content: center; gap: 6px; padding: 20px 6px 0; border-bottom: 6px solid #52412a; box-shadow: 0 7px 9px -5px rgba(0,0,0,.6); }
.shelf-bk .spine {
writing-mode: vertical-rl; letter-spacing: .18em; font-size: 13px; font-weight: 700;
color: #f6ecd9; border: none; border-radius: 4px 4px 2px 2px; cursor: pointer;
padding: 12px 7px; min-height: 152px; width: 34px; font-family: inherit;
box-shadow: inset -3px 0 5px rgba(0,0,0,.3), 0 3px 0 rgba(0,0,0,.35);
transition: transform .18s;
}
.shelf-bk .spine:hover { transform: translateY(-12px) rotate(-2deg); }
.shelf-bk .spine:active { transform: translateY(-3px) scale(.97); }
.shelf-bk .spine.pull { transform: translateY(-24px) rotate(-7deg); transition: transform .36s cubic-bezier(.3,.1,.3,1.25); }
/* 翻书阅读器：跨页 + 双面翻页片 */
.rbook { position: relative; display: flex; justify-content: center; perspective: 1500px; margin: 8px 0 2px; }
.rbook::before { content: ""; position: absolute; left: 50%; top: 2px; bottom: 2px; width: 4px; transform: translateX(-50%); background: linear-gradient(90deg,rgba(60,40,18,.22),rgba(60,40,18,.05),rgba(60,40,18,.22)); z-index: 6; pointer-events: none; }
.rside { width: 208px; height: 276px; position: relative; cursor: pointer; }
.rside.l { border-radius: 6px 0 0 6px; background: linear-gradient(255deg,#faf4e2,#efe3c2 86%,#ded0aa); box-shadow: inset -16px 0 20px -14px rgba(70,48,24,.4); }
.rside.r { border-radius: 0 6px 6px 0; background: linear-gradient(105deg,#faf4e2,#efe3c2 86%,#ded0aa); box-shadow: inset 16px 0 20px -14px rgba(70,48,24,.4), 2px 10px 26px rgba(0,0,0,.32); }
.rpg { position: absolute; inset: 0; padding: 17px 18px 24px; box-sizing: border-box; }
.rpg em { display: block; font-style: normal; text-align: center; font-size: 10.5px; letter-spacing: .4em; color: #ab9368; margin-bottom: 9px; white-space: nowrap; overflow: hidden; }
.rpg p { margin: 0; font-family: "Kaiti SC", KaiTi, STKaiti, Georgia, serif; font-size: 14px; line-height: 2.1; color: #46341f; letter-spacing: .05em; text-align: justify; text-indent: 2em; }
.rpg p.nid { text-indent: 0; }
.rpg i { position: absolute; bottom: 8px; left: 0; right: 0; text-align: center; font-style: normal; font-size: 10px; color: #b5a37b; font-family: Georgia, serif; }
.rpg.tp { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.rpg.tp h4 { margin: 12px 0; font-family: "Kaiti SC", KaiTi, STKaiti, Georgia, serif; font-size: 20px; letter-spacing: .32em; color: #5a4326; font-weight: 700; writing-mode: vertical-rl; max-height: 172px; }
.rpg.tp .rule { width: 46px; height: 1px; background: #b5a37b; margin: 8px 0; }
.rpg.tp .sub { font-family: "Kaiti SC", KaiTi, STKaiti, serif; font-size: 13px; color: #7a6844; letter-spacing: .2em; }
.rflip { position: absolute; inset: 0; transform-origin: left center; transform-style: preserve-3d; z-index: 5; display: none; pointer-events: none; }
.rflip .ff { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 0 6px 6px 0; padding: 17px 18px 24px; box-sizing: border-box; overflow: hidden; }
.rflip .ff.f { background: linear-gradient(105deg,#faf4e2,#efe3c2 86%,#ded0aa); box-shadow: inset 16px 0 20px -14px rgba(70,48,24,.4); }
.rflip .ff.b { transform: rotateY(180deg); background: linear-gradient(255deg,#f6eed8,#eadfba); box-shadow: inset -16px 0 20px -14px rgba(70,48,24,.4); }
.rflip.on { display: block; }
.rflip.go { animation: pgt .64s cubic-bezier(.4,.06,.2,1) forwards; }
.rflip.bk.go { animation: pgtB .64s cubic-bezier(.4,.06,.2,1) forwards; }
@keyframes pgt { from { transform: rotateY(0); } to { transform: rotateY(-180deg); } }
@keyframes pgtB { from { transform: rotateY(-180deg); } to { transform: rotateY(0); } }
.rnav { display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 8px; }
.rnav #bk-nav { font-size: 11px; color: #9c8a6a; letter-spacing: .1em; }
@media (max-width: 780px) {
.rside.l { display: none; }
.rside { width: min(238px, 76vw); height: 312px; }
.rbook::before { display: none; }
.rside.r { border-radius: 6px; }
}
.scene .pot .steam { transition: .2s; }
.scene .pot.boil .steam { animation: boil .5s ease-in-out infinite; }
@keyframes boil { 50% { transform: translateY(-7px) scale(1.25); opacity: 1; } }
.scene .cab { transform-box: fill-box; transform-origin: 50% 0; transition: transform .3s; }
.scene .cab.open { transform: rotateX(14deg); }
.scene .tread, .scene .rack { opacity: 0; pointer-events: none; transition: opacity .5s; }

.scene .tank, .scene .chime { opacity: 0; pointer-events: none; transition: opacity .5s; }

.scene .tank .fsh { animation: fswim 5s ease-in-out infinite; }

.scene .tank .fsh.fc { animation-duration: 4.2s; animation-delay: -1.2s; }

.scene .tank.feed .fsh { animation: fdash .8s ease-in-out 2; }

.scene .chime .tu { transform-box: fill-box; transform-origin: 50% 0; }

.scene .chime.on .tu.t3 { animation-duration: 3.1s; animation-delay: -1.6s; }
@keyframes tsway { 0%, 100% { transform: rotate(5deg); } 50% { transform: rotate(-5deg); } }
.scene .chime.ring .tu { animation: tring .9s ease-in-out 2; }
@keyframes tring { 25% { transform: rotate(16deg); } 75% { transform: rotate(-16deg); } }
.scene .fly .flg { opacity: .22; transition: opacity .4s; }
.scene .fly.on { filter: drop-shadow(0 0 7px rgba(255,180,80,.65)); }
.scene .fly.on .flg { opacity: 1; animation: lantbreath 2.6s ease-in-out infinite; }
@keyframes lantbreath { 50% { opacity: .55; } }
@keyframes bodyshake { 20% { transform: translate(3px, -2px); } 40% { transform: translate(-3px, 2px); } 60% { transform: translate(2px, 1px); } 80% { transform: translate(-1px, -1px); } }
#pack-wrap { position: fixed; inset: 0; z-index: 150; display: none; align-items: center; justify-content: center;
background: radial-gradient(ellipse at center, rgba(8,10,18,.5), rgba(8,10,18,.84)); }
#pack-wrap.on { display: flex; }
.pack-card {
width: 150px; height: 210px; border-radius: 14px; cursor: pointer; color: #e8c98a;
background: linear-gradient(150deg, #6d4a26, #3c2a16 55%, #57391d);
border: 3px solid #c9a15f; box-shadow: 0 18px 40px rgba(0,0,0,.5), inset 0 0 0 2px rgba(0,0,0,.25);
display: flex; align-items: center; justify-content: center;
animation: packdrop .55s cubic-bezier(.2,.9,.3,1.4) backwards, packfloat 2.6s ease-in-out .55s infinite;
}
.pack-card:hover { animation: packwob .5s ease-in-out infinite; }
.pack-card.burst { animation: packburst .5s forwards; }
@keyframes packdrop { from { transform: translateY(-70vh) rotate(200deg); } }
@keyframes packfloat { 50% { transform: translateY(-10px) rotate(2deg); } }
@keyframes packwob { 25% { transform: rotate(-4deg); } 75% { transform: rotate(4deg); } }
@keyframes packburst { 40% { transform: scale(1.25); opacity: 1; } 100% { transform: scale(1.8); opacity: 0; } }
.pack-item {
position: relative; width: 212px; padding: 30px 18px 24px; border-radius: 16px; cursor: pointer;
text-align: center; overflow: hidden;
background: linear-gradient(165deg, #fdf6e3, #e8d9b0);
border: 3px solid #b8862f; box-shadow: 0 22px 50px rgba(0,0,0,.55);
animation: cardout .7s cubic-bezier(.2,.8,.3,1.15) backwards;
}
.pack-item .ic { color: #7a5a20; }
.pack-item .pi-name { font-size: 15px; font-weight: 900; letter-spacing: 3px; color: #5d431a; margin-top: 10px; }
.pack-item.leg { border-color: #e8892c; background: linear-gradient(165deg, #2a1c10, #4a2f14);
box-shadow: 0 0 34px rgba(240,150,50,.55), 0 22px 50px rgba(0,0,0,.6); }
.pack-item.leg .ic { color: #f5b942; }
.pack-item.leg .pi-name { color: #f2d191; }
.pack-item::after { content: ""; position: absolute; inset: -60%; pointer-events: none;
background: linear-gradient(115deg, transparent 42%, rgba(255,236,180,.5) 50%, transparent 58%);
animation: sheen 2.2s linear infinite; }
@keyframes cardout { from { transform: translateY(46vh) rotate(340deg) scale(.4); } }
@keyframes sheen { from { transform: translateX(-60%); } to { transform: translateX(60%); } }
.pack-item.fly { animation: cardfly .6s ease-in forwards; }
@keyframes cardfly { to { transform: translateY(-80vh) rotate(14deg); opacity: 0; } }
#frame-wrap { position: fixed; inset: 0; z-index: 120; display: none; background: var(--paper); }
#frame-wrap.on { display: block; }
#room-frame { width: 100%; height: 100%; border: 0; display: block; background: #fff; }
#frame-back {
position: absolute; top: 14px; left: 14px; z-index: 2;
width: 46px; height: 46px; border-radius: 50%;
display: flex; align-items: center; justify-content: center;
border: 2px solid var(--line); background: var(--paper);
color: var(--ink-2); cursor: pointer; box-shadow: 0 6px 18px rgba(0,0,0,.22);
transition: .15s;
}
#frame-back:hover { border-color: var(--gold); color: var(--gold); transform: translateY(-2px); }
#frame-back .ic { font-size: 20px; }
@media (max-width: 640px) {
.rooms { grid-template-columns: 1fr; }
.win-row { gap: 16px; }
.scene { height: 190px; }
}
body.reduce-motion *, body.reduce-motion *::before, body.reduce-motion *::after {
animation-duration: .01s !important; animation-iteration-count: 1 !important;
transition-duration: .01s !important;
}

/* ---- v3.0 怀表渐变 / 住户小Z / 对话框 / 奖杯 ---- */
@property --sky-a { syntax: "<color>"; inherits: true; initial-value: #131c30; }
@property --sky-b { syntax: "<color>"; inherits: true; initial-value: #2c3a55; }
body { transition: --sky-a 1.2s ease, --sky-b 1.2s ease; }
#zface {
position: absolute; bottom: 8px; left: 0; z-index: 24;
width: 34px; height: 60px; cursor: pointer; user-select: none;
filter: drop-shadow(0 3px 4px rgba(0,0,0,.35));
}
#zface svg { width: 34px; height: 60px; display: block; }
#zface .zpart { transform-box: fill-box; transform-origin: 50% 8%; }
#zface.walking .legA, #zface.walking .armB { animation: stepA .46s linear infinite; }
#zface.walking .legB, #zface.walking .armA { animation: stepB .46s linear infinite; }
@keyframes stepA { 50% { transform: rotate(19deg); } }
@keyframes stepB { 50% { transform: rotate(-19deg); } }
#zface.wave .armB { animation: howdy .34s ease-in-out 4; }
@keyframes howdy { 40%,60% { transform: rotate(-138deg); } 50% { transform: rotate(-162deg); } }
#dlg {
position: fixed; left: 50%; bottom: 18px; transform: translate(-50%, 0);
width: min(92vw, 620px); z-index: 95; display: none;
background: linear-gradient(160deg, #1d2536, #12182a);
border: 1px solid rgba(240,196,106,.4); border-radius: 14px;
padding: 14px 18px; color: #f2ecd9; cursor: pointer;
box-shadow: 0 18px 46px rgba(0,0,0,.5);
}
#dlg.on { display: flex; gap: 14px; animation: dlgin .25s ease-out; }
@keyframes dlgin { from { transform: translate(-50%, 26px); opacity: 0; } }
.dlg-ava {
width: 54px; height: 54px; flex: none; border-radius: 50%;
background: radial-gradient(circle at 35% 30%, #2e3a56, #1a2236);
border: 2px solid rgba(240,196,106,.5);
display: flex; align-items: center; justify-content: center;
}
.dlg-ava svg { width: 40px; height: 36px; }
.dlg-name { font-size: 11px; letter-spacing: .3em; color: #f0c46a; margin-bottom: 4px; }
.dlg-text { font-size: 14.5px; line-height: 1.9; min-height: 56px; }
.dlg-next {
position: absolute; right: 14px; bottom: 8px; color: #f0c46a;
font-size: 13px; animation: breathe 1.4s infinite;
}
.cup-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(102px, 1fr)); gap: 8px; margin-top: 14px; }
.cup-card {
background: var(--paper-3); border: 2px solid var(--line);
border-radius: 10px; padding: 10px 6px 8px; text-align: center;
transition: .15s; cursor: pointer;
}
.cup-card:hover { transform: translateY(-2px); border-color: var(--gold-2); }
.cup-card .cup {
width: 34px; height: 34px; margin: 0 auto 6px; border-radius: 50%;
display: flex; align-items: center; justify-content: center;
font-size: 17px; color: #fff;
}
.cup-card .ctx b { font-size: 11.5px; display: block; letter-spacing: .05em; }
.cup-card .ctx span { font-size: 10px; color: var(--ink-3); display: block; }
.cup-bronze { background: radial-gradient(circle at 32% 28%, #d09272, #8a5136 70%); }
.cup-silver { background: radial-gradient(circle at 32% 28%, #e6ecf4, #8a94a6 70%); }
.cup-gold { background: radial-gradient(circle at 32% 28%, #f8df9a, #c9880e 70%); }
.cup-plat { background: radial-gradient(circle at 32% 28%, #e2f4fa, #77b8cc 65%, #4a8aa0); }
.cup-card.lock { opacity: .6; }
.cup-card.lock .cup { filter: grayscale(1) brightness(.8); }
.toast.trophy { border-color: #d9a441; background: linear-gradient(160deg, #2b3050, #171d33); }
.toast.trophy .cup {
width: 32px; height: 32px; font-size: 16px; border-radius: 50%;
display: flex; align-items: center; justify-content: center; color: #fff; flex: none;
}
.tmenu-item.kfocus {
background: rgba(212,136,15,.22); border-color: var(--gold-2);
transform: translateX(6px); box-shadow: 0 0 22px rgba(240,196,106,.18);
}

 vx: (Math.random() - .5) * .6, vy: 1.6 + Math.random(), life: 1, decay: 0.02, r: 2.2, color: "#e8b04b", g: 0.12 });
 },

loop() {
const { sctx, fctx, W, H } = this;

	}

}

sctx.strokeStyle = grad; sctx.lineWidth = 1.6;

this.meteors = this.meteors.filter(m => m.life > 0);
}
fctx.clearRect(0, 0, W, H);

for (const a of this.ambient) {

fctx.fillStyle = "#ffe9a8";
fctx.beginPath(); fctx.arc(a.x, a.y, a.s, 0, 7); fctx.fill();
fctx.globalAlpha = Math.max(0, glow) * 0.25;
fctx.beginPath(); fctx.arc(a.x, a.y, a.s * 3.4, 0, 7); fctx.fill();
} else if (a.kind === "snow") {
a.x += Math.sin(a.ph) * 0.5; a.y += a.vy;
if (a.y > H + 8) { a.y = -8; a.x = Math.random() * W; }
fctx.globalAlpha = 0.85; fctx.fillStyle = "#fff";
fctx.beginPath(); fctx.arc(a.x, a.y, a.s, 0, 7); fctx.fill();
} else if (a.kind === "rain") {
a.x += a.vx; a.y += a.vy;
if (a.y > H + 16) { a.y = -16; a.x = Math.random() * W; }
fctx.strokeStyle = "rgba(172,196,230,.42)"; fctx.lineWidth = 1;
fctx.beginPath(); fctx.moveTo(a.x, a.y); fctx.lineTo(a.x - a.vx * 1.6, a.y - a.len); fctx.stroke();

a.x += Math.sin(a.ph) * 0.7 + 0.3; a.y += a.vy * 0.7; a.rot += 0.02;

fctx.save();
fctx.translate(a.x, a.y); fctx.rotate(a.rot);
fctx.globalAlpha = 0.8; fctx.fillStyle = "#f2c4cf";
fctx.beginPath(); fctx.ellipse(0, 0, a.s * 1.7, a.s * 0.9, 0, 0, 7); fctx.fill();
fctx.restore();
}
}
fctx.globalAlpha = 1;
for (const p of this.parts) {
p.x += p.vx; p.y += p.vy; p.vy += p.g; p.life -= p.decay;
fctx.globalAlpha = Math.max(0, p.life);
fctx.fillStyle = p.color;
 if (p.shape === "z") { fctx.font = Math.round(p.r * 3) + "px Georgia"; fctx.fillStyle = "#aab3c8"; fctx.fillText("z", p.x, p.y); }
 else if (p.shape === "heart") {
this.drawHeart(fctx, p.x, p.y, p.r);
} else if (p.flash) {
fctx.beginPath(); fctx.arc(p.x, p.y, p.r * (2 - p.life) * 2, 0, 7); fctx.fill();
} else {
fctx.beginPath(); fctx.arc(p.x, p.y, p.r * p.life + 0.4, 0, 7); fctx.fill();
}
}
fctx.globalAlpha = 1;
for (const r of this.rockets) {
r.y += r.vy;
fctx.fillStyle = "#fdf0d5";
fctx.beginPath(); fctx.arc(r.x, r.y, 2.2, 0, 7); fctx.fill();
fctx.globalAlpha = 0.3;
fctx.beginPath(); fctx.arc(r.x, r.y + 8, 2.6, 0, 7); fctx.fill();
fctx.globalAlpha = 1;
if (r.y <= r.target) { this.explode(r); r.dead = true; }
}
this.rockets = this.rockets.filter(r => !r.dead);
this.parts = this.parts.filter(p => p.life > 0);
requestAnimationFrame(() => this.loop());
},
};

function paginate(t, per) {
const parts = t.match(/[^。；！？]*[。；！？]+|[^。；！？]+$/g) || [];
const out = []; let cur = "";
for (const s of parts) {
if (cur && cur.length + s.length > per) { out.push(cur); cur = ""; }
cur += s;
}
if (cur) out.push(cur);
return out;
}

});
addEventListener("click", e => {

if (t !== "laser" && t !== "yarn" || !S.owned.includes("cat") || !toyGate(e)) return;
const el = document.getElementById(t === "laser" ? "ldot" : "yarnb");
el.style.opacity = 1;
el.classList.remove("pop");
el.style.left = e.clientX - (t === "laser" ? 5 : 10) + "px";
if (t === "laser") {
TOY.hop = 0; TOY.x = e.clientX; AU.sfx("fwup");
el.style.top = e.clientY - 5 + "px";
} else {
TOY.x = e.clientX; TOY.vx = (Math.random() < 0.5 ? -1 : 1) * (2.4 + Math.random() * 1.3);
el.style.top = innerHeight - 116 + "px";
AU.sfx("click");
}
});
TOY.tick = (st, max) => {
if (TOY.cd) TOY.cd--;
if (TOY.x == null) return;
if (st.sleep) { st.sleep = 0; st.pause = 26; }
st.idle = 0;
if (TOY.vx) {
TOY.x += TOY.vx; TOY.vx *= 0.992;
if (TOY.x < 26 || TOY.x > max) { TOY.vx *= -1; TOY.x = Math.min(max, Math.max(26, TOY.x)); }
if (Math.abs(TOY.vx) < 0.05) TOY.vx = 0;
const b = document.getElementById("yarnb");
b.style.left = TOY.x - 10 + "px";
b.style.transform = "rotate(" + TOY.x * 9 + "deg)";
}
st.dir = TOY.x > st.x ? 1 : -1;
if (!st.pounce) st.x = Math.min(max, Math.max(16, st.x + st.dir * (S.equipped.toy === "laser" ? 4.6 : 2.8)));
if (Math.abs(TOY.x - st.x) > 15 || TOY.cd) return;
let caught = false;
if (S.equipped.toy === "wand") {
TOY.cd = 80; st.pounce = 12; st.vx = st.dir * 2.6;
AU.sfx("purr");
caught = true;
} else if (S.equipped.toy === "laser") {
const d = document.getElementById("ldot");
TOY.cd = 30; AU.sfx("meow");
if (++TOY.hop < 3) {
TOY.x = 46 + Math.random() * (max - 80);
d.style.left = TOY.x - 5 + "px";
d.style.top = innerHeight - 140 + Math.random() * 70 + "px";
} else {
TOY.x = null;
d.style.opacity = 0;
FXC.hearts(st.x + 26, innerHeight - 104);
caught = true;
}
} else if (!TOY.vx) {
TOY.cd = 70; TOY.x = null; AU.sfx("chomp"); AU.sfx("meow");
FXC.hearts(st.x + 26, innerHeight - 104);
const b = document.getElementById("yarnb");
b.classList.add("pop");
setTimeout(() => { b.style.opacity = 0; b.classList.remove("pop"); }, 420);
caught = true;
}
if (caught) { S.stats.pets++; checkQuests(); }
};
TOY.reset = () => {
TOY.x = null; TOY.cd = 0; TOY.vx = 0;
for (const i of ["wand", "ldot", "yarnb"]) {
const el = document.getElementById(i);
el.style.opacity = 0; el.classList.remove("pop");
}
};

const dlgEl = document.getElementById("dlg");

let dlgQueue = [], dlgFull = "", dlgI = 0, dlgTimer = null, dlgTyping = false;

function talkPool() {
if (!S.stats.talks) return TALK.first.slice();
let pool = [];
	if (S.equipped.weather === "rain") pool = pool.concat(TALK.rain);
	if (S.equipped.weather === "snow") pool = pool.concat(TALK.snow);
if (document.body.dataset.phase === "night") pool = pool.concat(TALK.night);
if (S.owned.includes("cat")) pool = pool.concat(TALK.cat);
if (Object.keys(S.cgs).length >= CGS.length) pool = pool.concat(TALK.done);
if (Math.random() < 0.55) pool = pool.concat(TALK.tips);
if (Math.random() < 0.55 || !pool.length) pool = pool.concat(TALK.daily);
const pick = pool[Math.floor(Math.random() * pool.length)];
return Math.random() < 0.3 ? [pick, TALK.daily[Math.floor(Math.random() * TALK.daily.length)]] : [pick];

function typeLine(s) {

dlgText.textContent = dlgFull.slice(0, ++dlgI);

}, 34);
}

/* 屋顶小屋 · 过山车：沿门面外框滚动，重力切向加速 + 摩擦，可拖拽甩出 */
(function () {
const mark = document.querySelector(".roofline"), box = document.getElementById("facade");
let pts = [], L = 0, s = 0, v = 0, drag = null, last = performance.now(), lastW = 0, built = false;
function build() {
 const w = box.offsetWidth, h = box.offsetHeight, r = 20;
 if (w < 40 || h < 40) return;
 pts = [];
 const seg = (x1, y1, x2, y2) => { const d = Math.hypot(x2 - x1, y2 - y1), n = Math.max(1, Math.round(d / 8));
 for (let i = 0; i < n; i++) pts.push({ x: x1 + (x2 - x1) * i / n, y: y1 + (y2 - y1) * i / n }); };
 const arc = (cx, cy, a0, a1) => { for (let i = 0; i < 5; i++) { const a = a0 + (a1 - a0) * i / 5;
 pts.push({ x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r }); } };
 seg(r, 0, w - r, 0); arc(w - r, r, -Math.PI / 2, 0); seg(w, r, w, h - r); arc(w - r, h - r, 0, Math.PI / 2);
 seg(w - r, h, r, h); arc(r, h - r, Math.PI / 2, Math.PI); seg(0, h - r, 0, r); arc(r, r, Math.PI, Math.PI * 1.5);
 L = pts.length * 8;
 if (!built) { s = (box.offsetWidth - 40) / 2; built = true; }
}
function at(sv) {
const f = (((sv / 8) % pts.length) + pts.length) % pts.length;
const i = Math.floor(f), u = f - i;
const a = pts[i % pts.length], b = pts[(i + 1) % pts.length];
return { x: a.x + (b.x - a.x) * u, y: a.y + (b.y - a.y) * u };
}
function place() {
 if (!pts.length) return;
 const p = at(s), p2 = at(s + 4);
const ang = Math.atan2(p2.y - p.y, p2.x - p.x) * 180 / Math.PI;
mark.style.transform = "translate3d(" + (p.x - 31).toFixed(2) + "px," + (p.y - 28).toFixed(2) + "px,0) rotate(" + ang.toFixed(2) + "deg)";
}
function projS(cx, cy) {
 const rc = box.getBoundingClientRect(), k = rc.width / box.offsetWidth;
 const x = (cx - rc.left) / k, y = (cy - rc.top) / k;
 let bi = 0, bd = 1e9;
 for (let j = 0; j < pts.length; j++) { const dd = (pts[j].x - x) ** 2 + (pts[j].y - y) ** 2; if (dd < bd) { bd = dd; bi = j; } }
 return bi * 8;
}
function loop(now) {
 const dt = Math.min(0.05, (now - last) / 1000); last = now;
 if (box.offsetWidth > 40 && Math.abs(box.offsetWidth - lastW) > 1) { lastW = box.offsetWidth; build(); }
 if (!drag && pts.length) {
 const p = at(s), q = at(s + 8);
 const d = Math.hypot(q.x - p.x, q.y - p.y) || 1;
 const ty = (q.y - p.y) / d;
 v += (1900 * ty - 0.55 * v) * dt;
 if (Math.abs(v) < 3 && Math.abs(ty) < 0.06) v = 0;
 S.stats.coasterDist = (S.stats.coasterDist || 0) + Math.abs(v) * dt; // 里程表：成就「长途跋涉」认它
 s = (s + v * dt + L) % L; place();
 }
 requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
mark.addEventListener("pointerdown", e => {
 e.preventDefault();
 try { mark.setPointerCapture(e.pointerId); } catch (er) {}
 drag = { s: projS(e.clientX, e.clientY), t: performance.now(), moved: 0, sx: e.clientX, sy: e.clientY };
});
mark.addEventListener("pointermove", e => {
 if (!drag) return;
 const ns = projS(e.clientX, e.clientY), now = performance.now(), dt = Math.max(6, now - drag.t) / 1000;
 let d = ns - drag.s; if (d > L / 2) d -= L; if (d < -L / 2) d += L;
 (drag.vs = drag.vs || []).push(d / dt);
 if (drag.vs.length > 6) drag.vs.shift();
 drag.moved += Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy); drag.sx = e.clientX; drag.sy = e.clientY;
 drag.t = now;
 drag.s = ns; s = ns; place();
});
mark.addEventListener("pointerup", () => {
 if (drag) {
 const vs = drag.vs || [];
 if (vs.length) {
 let wsum = 0, vsum = 0;
 vs.forEach((vv, i) => { const w = i + 1; wsum += w; vsum += vv * w; });
 v = Math.max(-2600, Math.min(2600, vsum / wsum * 0.9));
 }
 if (drag.moved < 6) { v += (v >= 0 ? 1 : -1) * 300; AU.sfx("door"); }
 else if (Math.abs(v) > 900) AU.sfx("whoosh");
 if (Math.abs(v) > 1500) { S.stats.coaster = 1; checkQuests(); }
 }
 drag = null;
});
})();
